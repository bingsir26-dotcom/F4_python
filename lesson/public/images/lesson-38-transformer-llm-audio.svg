<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">文字 token 和音訊取樣都是數字訊號</title>
  <desc id="desc">左側顯示一句話的 context 和下一個 token 概念，右側顯示一秒音訊的八個取樣點。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="44" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">Transformer、LLM 和音訊：模型先處理訊號</text>
  <text x="44" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">文字可切成 token；聲音可量度成時間序列。模型輸出流暢，不等於內容已經查證。</text>
  <rect x="42" y="130" width="427" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">文字的 context</text>
  <rect x="72" y="208" width="86" height="49" rx="10" fill="#dbeafe"/><text x="89" y="239" font-family="system-ui,sans-serif" font-size="17" fill="#1e3a8a">Python</text>
  <rect x="172" y="208" width="72" height="49" rx="10" fill="#dbeafe"/><text x="190" y="239" font-family="system-ui,sans-serif" font-size="17" fill="#1e3a8a">可以</text>
  <rect x="258" y="208" width="72" height="49" rx="10" fill="#dbeafe"/><text x="276" y="239" font-family="system-ui,sans-serif" font-size="17" fill="#1e3a8a">分析</text>
  <rect x="344" y="208" width="72" height="49" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="362" y="239" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#92400e">資料</text>
  <text x="72" y="303" font-family="system-ui,sans-serif" font-size="17" fill="#334155">前面的 token 組成 context。</text>
  <text x="72" y="334" font-family="system-ui,sans-serif" font-size="17" fill="#334155">模型會估計下一個 token 的可能性。</text>
  <text x="72" y="380" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">黃色 token 是本例的人手示範答案。</text>
  <rect x="509" y="130" width="409" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="539" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f766e">一秒聲音的 8 次取樣</text>
  <path d="M560 337H873M560 213V367" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="575,290 615,230 655,263 695,337 735,350 775,290 815,230 855,263" fill="none" stroke="#059669" stroke-width="4"/>
  <g fill="#059669"><circle cx="575" cy="290" r="6"/><circle cx="615" cy="230" r="6"/><circle cx="655" cy="263" r="6"/><circle cx="695" cy="337" r="6"/><circle cx="735" cy="350" r="6"/><circle cx="775" cy="290" r="6"/><circle cx="815" cy="230" r="6"/><circle cx="855" cy="263" r="6"/></g>
  <text x="560" y="402" font-family="system-ui,sans-serif" font-size="16" fill="#475569">取樣率 = 每秒量度幾次</text>
</svg>
