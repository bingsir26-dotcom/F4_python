<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">input() 讓使用者把資料交給程式</title><desc id="desc">使用者輸入的內容先是文字；要計算時需轉為數字。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">input() 讓使用者把資料交給程式</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">輸入的內容先是文字；要計算時，記得轉為數字。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="85" cy="205" r="19" fill="#187b71"/><text x="85" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">1</text><text x="180.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">提示問題</text><text x="180.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">input()</text><text x="180.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">顯示問題並等待</text></g>
<g filter="url(#shadow)"><rect x="345" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="345" y="175" width="250" height="58" rx="20" fill="#8b5cf6"/><circle cx="375" cy="205" r="19" fill="#8b5cf6"/><text x="375" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">2</text><text x="470.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">使用者輸入</text><text x="470.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#8b5cf6">&quot;12&quot;</text><text x="470.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">按 Enter 送出內容</text></g>
<g filter="url(#shadow)"><rect x="635" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="635" y="175" width="250" height="58" rx="20" fill="#d78b1c"/><circle cx="665" cy="205" r="19" fill="#d78b1c"/><text x="665" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">3</text><text x="760.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">轉換數字</text><text x="760.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#d78b1c">int()</text><text x="760.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">把文字變成整數</text></g>
<g filter="url(#shadow)"><rect x="925" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="925" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="955" cy="205" r="19" fill="#187b71"/><text x="955" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">4</text><text x="1050.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">顯示答案</text><text x="1050.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">print()</text><text x="1050.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">輸出計算結果</text></g>
<rect x="175" y="500" width="850" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="540" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="24" fill="#365c58">依照 1 至 4 的次序，資料才會由使用者的輸入變成程式的答案。</text></svg>
