<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">函式的組成與呼叫</title><desc id="desc">一個名為 welcome_player 的函式，內有三行縮排程式；下方有兩次以不同名字呼叫的例子。</desc><rect width="960" height="360" fill="#f8fbff"/><rect x="45" y="42" width="500" height="250" rx="20" fill="#152238"/><text x="75" y="90" font-family="ui-monospace,monospace" font-size="27" fill="#7dd3fc">def welcome_player(name):</text><text x="104" y="140" font-family="ui-monospace,monospace" font-size="25" fill="#ffffff">print("=" * 20)</text><text x="104" y="184" font-family="ui-monospace,monospace" font-size="25" fill="#ffffff">print(f"歡迎你，{name}！")</text><text x="104" y="228" font-family="ui-monospace,monospace" font-size="25" fill="#ffffff">print("準備開始")</text><text x="75" y="274" font-family="system-ui,sans-serif" font-size="18" fill="#a7f3d0">縮排的三行，是這個工具要做的工作</text><rect x="605" y="55" width="300" height="105" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="635" y="100" font-family="ui-monospace,monospace" font-size="23" fill="#1e3a8a">welcome_player</text><text x="635" y="132" font-family="ui-monospace,monospace" font-size="23" fill="#1e3a8a">("Alex")</text><rect x="605" y="200" width="300" height="105" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="635" y="245" font-family="ui-monospace,monospace" font-size="23" fill="#166534">welcome_player</text><text x="635" y="277" font-family="ui-monospace,monospace" font-size="23" fill="#166534">("May")</text></svg>