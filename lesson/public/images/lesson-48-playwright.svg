<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Playwright——讓程式操作瀏覽器概念圖</title><desc id="desc">本課四個核心概念：browser、locator、wait_for、screenshot。</desc><rect width="960" height="350" fill="#f8fbff"/><text x="40" y="64" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#1e293b">Playwright——讓程式操作瀏覽器</text><text x="40" y="103" font-family="system-ui,sans-serif" font-size="19" fill="#64748b">用四個關鍵詞掌握本課重點</text><rect x="40" y="130" width="190" height="145" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="60" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">1 browser</text><text x="60" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">真實頁面環境</text><rect x="265" y="130" width="190" height="145" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="285" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#166534">2 locator</text><text x="285" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">定位元素</text><rect x="490" y="130" width="190" height="145" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="510" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#92400e">3 wait_for</text><text x="510" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">等待載入</text><rect x="715" y="130" width="190" height="145" rx="20" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/><text x="735" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#9d174d">4 screenshot</text><text x="735" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">保留畫面</text></svg>
