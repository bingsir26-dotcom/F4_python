<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">灰階圖片是像素 Tensor</title>
  <desc id="desc">一張六乘六的灰階像素圖被表示為數字格，並顯示通道和批次維度。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="44" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">Computer Vision：圖片是排好位置的像素數字</text>
  <text x="44" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">灰階像素可用 0 到 1 表示亮暗；形狀同時保留它在圖片中的位置。</text>
  <rect x="42" y="128" width="445" height="322" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="169" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">一張 6 × 6 灰階小圖</text>
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="112" y="201" width="210" height="210" fill="#fff"/>
    <path d="M147 201v210M182 201v210M217 201v210M252 201v210M287 201v210M112 236h210M112 271h210M112 306h210M112 341h210M112 376h210"/>
  </g>
  <g fill="#1e3a8a"><rect x="182" y="201" width="35" height="35"/><rect x="217" y="201" width="35" height="35"/><rect x="147" y="236" width="35" height="35"/><rect x="252" y="236" width="35" height="35"/><rect x="112" y="271" width="35" height="35"/><rect x="182" y="271" width="35" height="35"/><rect x="217" y="271" width="35" height="35"/><rect x="287" y="271" width="35" height="35"/><rect x="112" y="306" width="35" height="35"/><rect x="287" y="306" width="35" height="35"/><rect x="147" y="341" width="35" height="35"/><rect x="252" y="341" width="35" height="35"/><rect x="182" y="376" width="35" height="35"/><rect x="217" y="376" width="35" height="35"/></g>
  <text x="345" y="232" font-family="system-ui,sans-serif" font-size="17" fill="#475569">黑：0</text><rect x="345" y="246" width="34" height="18" fill="#fff" stroke="#94a3b8"/>
  <text x="345" y="303" font-family="system-ui,sans-serif" font-size="17" fill="#475569">白：1</text><rect x="345" y="317" width="34" height="18" fill="#1e3a8a"/>
  <rect x="528" y="128" width="388" height="322" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="560" y="169" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">同一張圖，不同層次的形狀</text>
  <rect x="561" y="208" width="320" height="55" rx="12" fill="#dbeafe"/><text x="584" y="242" font-family="monospace" font-size="20" font-weight="700" fill="#1e3a8a">[6, 6]</text><text x="698" y="242" font-family="system-ui,sans-serif" font-size="16" fill="#334155">高度、闊度</text>
  <rect x="561" y="282" width="320" height="55" rx="12" fill="#dcfce7"/><text x="584" y="316" font-family="monospace" font-size="20" font-weight="700" fill="#166534">[1, 6, 6]</text><text x="728" y="316" font-family="system-ui,sans-serif" font-size="16" fill="#334155">灰階通道、高、闊</text>
  <rect x="561" y="356" width="320" height="55" rx="12" fill="#fef3c7"/><text x="584" y="390" font-family="monospace" font-size="20" font-weight="700" fill="#92400e">[1, 1, 6, 6]</text><text x="751" y="390" font-family="system-ui,sans-serif" font-size="16" fill="#334155">批次、通道、高、闊</text>
</svg>
