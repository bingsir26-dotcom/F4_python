<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">多個變數盒子與 score 保存 80</title>
  <desc id="desc">畫面有多個代表變數的盒子，其中 score 盒子以黃色突出顯示並保存數值 80。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdfa"/><stop offset="1" stop-color="#fff8e8"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#145e5d" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#background)"/>
  <circle cx="105" cy="80" r="160" fill="#b9f5e7" opacity=".48"/><circle cx="1120" cy="650" r="185" fill="#ffe19a" opacity=".37"/>
  <text x="600" y="72" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="42" font-weight="700" fill="#123f43">變數：替資料貼上名字</text>
  <text x="600" y="115" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="25" fill="#4e6863">每個名字都對應一份資料；要使用資料時，寫出它的名字。</text>
  <g filter="url(#shadow)">
    <g transform="translate(85 202)"><rect width="225" height="228" rx="22" fill="#fffdf8" stroke="#79b7ae" stroke-width="4"/><rect x="31" y="-38" width="163" height="72" rx="15" fill="#25857c"/><text x="112" y="9" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#fff">player_name</text><text x="112" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#205a57">&quot;Alex&quot;</text><text x="112" y="190" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="17" fill="#58716a">玩家名稱</text></g>
    <g transform="translate(355 202)"><rect width="225" height="228" rx="22" fill="#fffdf8" stroke="#79b7ae" stroke-width="4"/><rect x="49" y="-38" width="127" height="72" rx="15" fill="#25857c"/><text x="112" y="9" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#fff">hp</text><text x="112" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="54" font-weight="700" fill="#205a57">100</text><text x="112" y="190" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="17" fill="#58716a">生命值</text></g>
    <g transform="translate(625 182)"><rect width="230" height="268" rx="22" fill="#fff7d6" stroke="#e4a619" stroke-width="7"/><rect x="35" y="-43" width="160" height="78" rx="16" fill="#dc8d14"/><text x="115" y="10" text-anchor="middle" font-family="Consolas, monospace" font-size="31" font-weight="700" fill="#fff">score</text><text x="115" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="72" font-weight="700" fill="#a65308">80</text><text x="115" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" font-weight="700" fill="#8b5505">這次測驗的分數</text></g>
    <g transform="translate(900 202)"><rect width="225" height="228" rx="22" fill="#fffdf8" stroke="#79b7ae" stroke-width="4"/><rect x="39" y="-38" width="147" height="72" rx="15" fill="#25857c"/><text x="112" y="9" text-anchor="middle" font-family="Consolas, monospace" font-size="29" font-weight="700" fill="#fff">gold</text><text x="112" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="54" font-weight="700" fill="#205a57">30</text><text x="112" y="190" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="17" fill="#58716a">遊戲金幣</text></g>
  </g>
  <g transform="translate(185 535)"><rect width="830" height="90" rx="20" fill="#fff" opacity=".9"/><text x="415" y="56" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="26" fill="#365c58">例如 <tspan font-family="Consolas, monospace" font-weight="700" fill="#b66708">score = 80</tspan>：把數字 80 放入名為 score 的變數。</text></g>
</svg>
