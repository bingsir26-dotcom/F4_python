<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">從條件找答案</title><desc id="desc">由條件產生 True 或 False，再篩選資料或建立新欄位。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">從條件找答案</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">pandas 可以把整欄資料一次比較，找出符合條件的資料列。</text><g filter="url(#shadow)"><rect x="70" y="170" width="330" height="270" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="70" y="170" width="330" height="52" rx="20" fill="#d78b1c"/><text x="235.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">條件</text></g><text x="235" y="258" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#d78b1c">scores_df[&quot;數學&quot;]</text><text x="235" y="310" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#d78b1c">&gt;= 60</text><text x="235" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">每一列得到 True 或 False</text><g filter="url(#shadow)"><rect x="435" y="170" width="300" height="270" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="435" y="170" width="300" height="52" rx="20" fill="#8b5cf6"/><text x="585.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">判斷結果</text></g><text x="585" y="258" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#187b71">True</text><text x="585" y="305" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#d78b1c">False</text><text x="585" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">只保留 True 的資料列</text><g filter="url(#shadow)"><rect x="770" y="170" width="360" height="270" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="770" y="170" width="360" height="52" rx="20" fill="#187b71"/><text x="950.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">新的資料欄</text></g><text x="950" y="258" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#187b71">總分 = 數學 + 英文</text><text x="950" y="320" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#187b71">平均分 = 總分 / 2</text><text x="950" y="385" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">讓表格回答更多問題</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">這是第一單元 if 判斷在整張資料表上的應用。</text></svg>
