<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">DataLoader 分批訓練和測試圖片</title>
  <desc id="desc">左半亮和右半亮的簡單圖片以小批形式訓練，測試時比較真正答案與模型預測。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="44" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">視覺小專題：分批訓練，也逐筆檢查預測</text>
  <text x="44" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">本課的人工圖案很簡單；目的在理解 DataLoader、訓練和評估的分工。</text>
  <rect x="42" y="130" width="310" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">訓練資料小批</text>
  <text x="72" y="201" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">batch size = 4</text>
  <g stroke="#64748b" stroke-width="1.5"><rect x="80" y="231" width="74" height="74" fill="#fff"/><path d="M117 231v74M80 268h74"/><rect x="192" y="231" width="74" height="74" fill="#fff"/><path d="M229 231v74M192 268h74"/><rect x="80" y="330" width="74" height="74" fill="#fff"/><path d="M117 330v74M80 367h74"/><rect x="192" y="330" width="74" height="74" fill="#fff"/><path d="M229 330v74M192 367h74"/></g>
  <g fill="#2563eb"><rect x="80" y="231" width="37" height="74"/><rect x="80" y="330" width="37" height="74"/></g><g fill="#f97316"><rect x="229" y="231" width="37" height="74"/><rect x="229" y="330" width="37" height="74"/></g>
  <text x="80" y="424" font-family="system-ui,sans-serif" font-size="15" fill="#1d4ed8">類別 0：左半亮</text><text x="192" y="424" font-family="system-ui,sans-serif" font-size="15" fill="#c2410c">類別 1：右半亮</text>
  <rect x="391" y="130" width="210" height="300" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="422" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">模型的兩個階段</text>
  <circle cx="431" cy="226" r="18" fill="#2563eb"/><text x="425" y="233" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">1</text><text x="464" y="232" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">train()</text>
  <text x="431" y="262" font-family="system-ui,sans-serif" font-size="16" fill="#475569">看 batch、計算 loss、</text><text x="431" y="285" font-family="system-ui,sans-serif" font-size="16" fill="#475569">更新參數。</text>
  <circle cx="431" cy="338" r="18" fill="#059669"/><text x="425" y="345" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">2</text><text x="464" y="344" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#065f46">eval()</text>
  <text x="431" y="374" font-family="system-ui,sans-serif" font-size="16" fill="#475569">只預測，不更新參數。</text>
  <rect x="640" y="130" width="278" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="670" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#334155">測試時逐筆比較</text>
  <text x="672" y="224" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">真正答案</text><text x="809" y="224" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">預測</text>
  <g font-family="monospace" font-size="18" fill="#334155"><text x="680" y="268">0</text><text x="817" y="268">0</text><text x="680" y="308">1</text><text x="817" y="308">1</text><text x="680" y="348">0</text><text x="817" y="348">0</text><text x="680" y="388">1</text><text x="817" y="388">1</text></g>
  <text x="672" y="415" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#166534">準確率是總結；錯誤樣本才有線索。</text>
</svg>
