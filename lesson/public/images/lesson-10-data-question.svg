<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">資料分析：由資料、問題到結論</title><desc id="desc">用一串分數提出問題，再用 Python 程式得到可以說出的結論。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">資料分析：由資料、問題到結論</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">同一份資料，可以由不同問題得到不同結論。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="255" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="54" rx="20" fill="#187b71"/><text x="180" y="211" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">資料</text><text x="180" y="300" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" fill="#187b71">[78, 55,</text><text x="180" y="334" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" fill="#187b71">91, 72, 84]</text><text x="180" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">五位同學的分數</text></g>
<g filter="url(#shadow)"><rect x="345" y="175" width="250" height="255" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="345" y="175" width="250" height="54" rx="20" fill="#8b5cf6"/><text x="470" y="211" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">問題</text><text x="470" y="295" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#6d3cc5">平均分？</text><text x="470" y="338" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#6d3cc5">多少人及格？</text><text x="470" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">先決定想知道甚麼</text></g>
<g filter="url(#shadow)"><rect x="635" y="175" width="250" height="255" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="635" y="175" width="250" height="54" rx="20" fill="#d78b1c"/><text x="760" y="211" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">Python 處理</text><text x="760" y="295" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#d78b1c">for + if</text><text x="760" y="338" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#d78b1c">total / len()</text><text x="760" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">用已學工具計算</text></g>
<g filter="url(#shadow)"><rect x="925" y="175" width="220" height="255" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="925" y="175" width="220" height="54" rx="20" fill="#187b71"/><text x="1035" y="211" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">結論</text><text x="1035" y="295" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">平均 76 分</text><text x="1035" y="338" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">4 人及格</text><text x="1035" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">可以用完整句子說出</text></g>
<rect x="150" y="510" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="545" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">資料分析先從清楚問題開始，而不是先從複雜工具開始。</text>
</svg>
