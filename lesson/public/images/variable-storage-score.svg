<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Python 變數像有標籤的收納盒</title>
  <desc id="desc">程式碼 score 等於 80，把數值 80 放入一個標示為 score 的盒子裡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="box" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f766e" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="94" cy="90" r="170" fill="#99f6e4" opacity=".35"/>
  <circle cx="1120" cy="630" r="180" fill="#bfdbfe" opacity=".38"/>

  <text x="600" y="80" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="44" font-weight="700" fill="#134e4a">變數：替資料貼上一個名字</text>
  <text x="600" y="128" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="25" fill="#475569">把它想像成一個貼了標籤、可以存放資料的收納盒。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="218" width="365" height="246" rx="26" fill="#102a43"/>
  </g>
  <rect x="90" y="218" width="365" height="54" rx="26" fill="#173c5b"/>
  <circle cx="128" cy="245" r="9" fill="#fb7185"/>
  <circle cx="158" cy="245" r="9" fill="#fbbf24"/>
  <circle cx="188" cy="245" r="9" fill="#34d399"/>
  <text x="272" y="253" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="19" fill="#cbd5e1">Python 程式碼</text>
  <text x="130" y="362" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#f8fafc">score</text>
  <text x="281" y="362" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#fbbf24">=</text>
  <text x="342" y="362" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#86efac">80</text>
  <text x="272" y="421" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" fill="#cbd5e1">把右邊的資料放入左邊的名稱</text>
  <text x="573" y="306" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="23" font-weight="700" fill="#0f766e">放入</text>

  <g filter="url(#shadow)">
    <rect x="715" y="204" width="388" height="315" rx="25" fill="url(#box)" stroke="#0f766e" stroke-width="7"/>
    <path d="M715 297 H1103" stroke="#0f766e" stroke-width="7"/>
    <rect x="782" y="158" width="254" height="99" rx="17" fill="#0f766e"/>
    <text x="909" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="46" font-weight="700" fill="#ffffff">score</text>
    <text x="909" y="399" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="96" font-weight="700" fill="#0f766e">80</text>
    <text x="909" y="462" text-anchor="middle" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="22" fill="#475569">目前存放的資料</text>
  </g>

  <g>
    <rect x="142" y="567" width="916" height="76" rx="20" fill="#ffffff" opacity=".87"/>
    <circle cx="185" cy="605" r="19" fill="#fbbf24"/>
    <text x="185" y="613" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">!</text>
    <text x="224" y="614" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="27" font-weight="700" fill="#334155">之後只要寫 <tspan font-family="Consolas, 'Courier New', monospace" fill="#0f766e">print(score)</tspan>，Python 就會顯示盒子裡的 <tspan font-family="Consolas, 'Courier New', monospace" fill="#0f766e">80</tspan>。</text>
  </g>
</svg>
