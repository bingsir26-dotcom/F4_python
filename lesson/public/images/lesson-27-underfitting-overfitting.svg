<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">太簡單、較合適、太貼近細節</title><desc id="desc">三個分類圖示表示欠擬合、較合適與過擬合，並比較訓練和測試表現。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ee"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><filter id="s" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#6c4a25" flood-opacity=".14"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="86" cy="87" r="147" fill="#ffe0a6" opacity=".42"/><circle cx="1124" cy="552" r="166" fill="#c6e7ff" opacity=".48"/><text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#5b3d1f">模型不是越複雜越好</text><text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#716452">同時看訓練與測試表現，才知道模型是否能面對新資料。</text>
<g filter="url(#s)"><rect x="54" y="160" width="330" height="354" rx="24" fill="#fffdf9"/><rect x="435" y="160" width="330" height="354" rx="24" fill="#fffdf9"/><rect x="816" y="160" width="330" height="354" rx="24" fill="#fffdf9"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700" text-anchor="middle"><text x="219" y="207" font-size="25" fill="#a6544b">太簡單：欠擬合</text><text x="600" y="207" font-size="25" fill="#3c8160">較合適</text><text x="981" y="207" font-size="25" fill="#6c57a0">太貼近細節：過擬合</text></g>
<g stroke="#b6c2c0" stroke-width="2"><path d="M105 397V252H335"/><path d="M486 397V252H716"/><path d="M867 397V252H1097"/></g><g fill="#5279bc"><circle cx="139" cy="355" r="8"/><circle cx="169" cy="335" r="8"/><circle cx="197" cy="316" r="8"/><circle cx="228" cy="296" r="8"/></g><g fill="#df7d50"><circle cx="241" cy="355" r="8"/><circle cx="271" cy="334" r="8"/><circle cx="301" cy="313" r="8"/><circle cx="324" cy="288" r="8"/></g><line x1="115" y1="298" x2="329" y2="349" stroke="#d75e59" stroke-width="6" stroke-linecap="round"/>
<g fill="#5279bc"><circle cx="520" cy="355" r="8"/><circle cx="550" cy="335" r="8"/><circle cx="578" cy="316" r="8"/><circle cx="609" cy="296" r="8"/></g><g fill="#df7d50"><circle cx="622" cy="355" r="8"/><circle cx="652" cy="334" r="8"/><circle cx="682" cy="313" r="8"/><circle cx="705" cy="288" r="8"/></g><path d="M500 365 C556 335 603 322 700 281" fill="none" stroke="#4e9a70" stroke-width="6" stroke-linecap="round"/>
<g fill="#5279bc"><circle cx="901" cy="355" r="8"/><circle cx="931" cy="335" r="8"/><circle cx="959" cy="316" r="8"/><circle cx="990" cy="296" r="8"/></g><g fill="#df7d50"><circle cx="1003" cy="355" r="8"/><circle cx="1033" cy="334" r="8"/><circle cx="1063" cy="313" r="8"/><circle cx="1086" cy="288" r="8"/></g><path d="M880 370 C895 265 928 390 953 280 C982 415 1014 251 1045 340 C1068 370 1084 285 1100 270" fill="none" stroke="#8064b4" stroke-width="5" stroke-linecap="round"/>
<g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" text-anchor="middle"><text x="219" y="437" fill="#8d594f">訓練：低　測試：低</text><text x="600" y="437" fill="#4b765e">訓練：好　測試：好</text><text x="981" y="437" fill="#685779">訓練：很高　測試：下降</text></g><rect x="224" y="550" width="752" height="43" rx="15" fill="#fff" opacity=".88"/><text x="600" y="579" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#716452">目標是抓到可重複的規律，而不是背下訓練資料的偶然細節。</text></svg>
