<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">看懂一張 DataFrame</title><desc id="desc">用 head、columns 和 shape 檢查資料表。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">看懂一張 DataFrame</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">讀資料表前，先問三個問題：有甚麼欄位？有多少資料？開頭資料正常嗎？</text><g filter="url(#shadow)"><rect x="70" y="170" width="610" height="290" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="70" y="170" width="610" height="52" rx="20" fill="#187b71"/><text x="375.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">DataFrame：scores_df</text></g><rect x="100" y="245" width="180" height="48" fill="#e7f8ed"/><text x="190.0" y="276" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0c5c62">姓名</text><rect x="280" y="245" width="130" height="48" fill="#e7f8ed"/><text x="345.0" y="276" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0c5c62">班別</text><rect x="410" y="245" width="120" height="48" fill="#e7f8ed"/><text x="470.0" y="276" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0c5c62">數學</text><rect x="530" y="245" width="120" height="48" fill="#e7f8ed"/><text x="590.0" y="276" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" font-weight="700" fill="#0c5c62">英文</text><rect x="100" y="305" width="180" height="48" fill="#fff"/><text x="190.0" y="340" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" fill="#365c58">Alex</text><rect x="280" y="305" width="130" height="48" fill="#fff"/><text x="345.0" y="340" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" fill="#365c58">F4A</text><rect x="410" y="305" width="120" height="48" fill="#fff"/><text x="470.0" y="340" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#365c58">78</text><rect x="530" y="305" width="120" height="48" fill="#fff"/><text x="590.0" y="340" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#365c58">82</text><rect x="100" y="355" width="180" height="48" fill="#fff"/><text x="190.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" fill="#365c58">Chris</text><rect x="280" y="355" width="130" height="48" fill="#fff"/><text x="345.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="18" font-weight="400" fill="#365c58">F4A</text><rect x="410" y="355" width="120" height="48" fill="#fff"/><text x="470.0" y="390" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#365c58">65</text><rect x="530" y="355" width="120" height="48" fill="#fff"/><text x="590.0" y="390" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#365c58">70</text><g filter="url(#shadow)"><rect x="735" y="170" width="395" height="88" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="735" y="170" width="395" height="52" rx="20" fill="#8b5cf6"/><text x="932.5" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">1  head()</text></g><text x="932" y="229" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="400" fill="#365c58">先看前幾列</text><g filter="url(#shadow)"><rect x="735" y="280" width="395" height="88" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="735" y="280" width="395" height="52" rx="20" fill="#d78b1c"/><text x="932.5" y="314" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">2  columns</text></g><text x="932" y="339" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="400" fill="#365c58">查看欄位名稱</text><g filter="url(#shadow)"><rect x="735" y="390" width="395" height="88" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="735" y="390" width="395" height="52" rx="20" fill="#187b71"/><text x="932.5" y="424" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">3  shape</text></g><text x="932" y="449" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="400" fill="#365c58">列數和欄數</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">先觀察資料，再決定下一個問題。</text></svg>
