<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NumPy：整組數字一起計算</title><desc id="desc">NumPy array 對整組數字進行相同運算。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">NumPy：整組數字一起計算</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">NumPy array 會把同一種運算套用到整組數字。</text><g filter="url(#shadow)"><rect x="60" y="175" width="290" height="250" rx="22" fill="#fffdf8" stroke="#64748b" stroke-width="4"/><rect x="60" y="175" width="290" height="52" rx="20" fill="#64748b"/><text x="205.0" y="209" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">原本的 array</text></g><text x="205" y="270" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" fill="#64748b">[78, 65, 91]</text><text x="205" y="350" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">一組分數</text><g filter="url(#shadow)"><rect x="455" y="175" width="290" height="250" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="455" y="175" width="290" height="52" rx="20" fill="#d78b1c"/><text x="600.0" y="209" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">同一個運算</text></g><text x="600" y="270" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="700" fill="#d78b1c">+ 5</text><text x="600" y="350" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">每個數字都加 5</text><g filter="url(#shadow)"><rect x="850" y="175" width="290" height="250" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="850" y="175" width="290" height="52" rx="20" fill="#187b71"/><text x="995.0" y="209" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">新的 array</text></g><text x="995" y="270" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" fill="#187b71">[83, 70, 96]</text><text x="995" y="350" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">整組結果</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">NumPy 適合數字運算；pandas 適合有欄位名稱的表格。</text></svg>
