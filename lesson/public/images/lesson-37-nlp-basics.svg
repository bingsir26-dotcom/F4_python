<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">文字向量化成詞語計數矩陣</title>
  <desc id="desc">四句英文評論建立詞彙表，並轉成每句一列、每個詞一欄的數字矩陣。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="44" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">NLP 入門：先把文字整理成數字欄位</text>
  <text x="44" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">Bag-of-words 只記錄詞語是否出現或出現多少次，暫時不完整理解語序。</text>
  <rect x="42" y="130" width="273" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">四句訓練文字</text>
  <g font-family="monospace" font-size="17" fill="#334155"><text x="72" y="222">good game</text><text x="72" y="267">great fun</text><text x="72" y="312">bad game</text><text x="72" y="357">boring game</text></g>
  <text x="72" y="403" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">每一句將成為矩陣的一行</text>
  <rect x="350" y="130" width="235" height="300" rx="20" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="380" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#065f46">詞彙表</text>
  <g font-family="monospace" font-size="17" fill="#166534"><text x="380" y="218">bad</text><text x="380" y="252">boring</text><text x="380" y="286">fun</text><text x="380" y="320">game</text><text x="380" y="354">good</text><text x="380" y="388">great</text></g>
  <rect x="620" y="130" width="298" height="300" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="650" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#9a3412">特徵矩陣</text>
  <g font-family="monospace" font-size="14" fill="#7c2d12"><text x="650" y="205">bad  bor  fun  game good great</text><text x="650" y="246"> 0    0    0    1    1    0</text><text x="650" y="285"> 0    0    1    0    0    1</text><text x="650" y="324"> 1    0    0    1    0    0</text><text x="650" y="363"> 0    1    0    1    0    0</text></g>
  <text x="650" y="408" font-family="system-ui,sans-serif" font-size="15" fill="#7c2d12">行：句子　　列：詞語欄位</text>
</svg>
