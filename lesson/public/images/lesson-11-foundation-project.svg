<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">把工具組合起來，完成迷你角色管理器</title>
  <desc id="desc">小作品先使用固定角色資料，再加入角色稱號，最後加入互動輸入。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="95" cy="70" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1130" cy="570" r="162" fill="#c9e0ff" opacity=".52"/>
  <text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="40" font-weight="700" fill="#123f43">把工具組合起來，完成一個小作品</text>
  <text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="23" fill="#365c58">用同一個角色資料，逐層加入新功能，比一次寫完更容易檢查。</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="320" height="330" rx="25" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><circle cx="115" cy="215" r="25" fill="#187b71"/><text x="115" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="225" y="223" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">固定資料版</text>
    <text x="105" y="285" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#187b71">Nova : 80</text><text x="105" y="320" font-family="Consolas,'Courier New',monospace" font-size="20" fill="#187b71">Rex  : 65</text>
    <text x="230" y="395" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">List + Dictionary + for</text><text x="230" y="435" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">先確認平均金幣正確</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="170" width="320" height="330" rx="25" fill="#fffdf8" stroke="#2563eb" stroke-width="4"/><circle cx="485" cy="215" r="25" fill="#2563eb"/><text x="485" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="600" y="223" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">加入角色稱號</text>
    <text x="475" y="285" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#2563eb">get_title(80)</text><text x="475" y="320" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#2563eb">=&gt; 高手</text>
    <text x="600" y="395" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">函式收好判斷規則</text><text x="600" y="435" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">主程式只使用結果</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="810" y="170" width="320" height="330" rx="25" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><circle cx="855" cy="215" r="25" fill="#d78b1c"/><text x="855" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="970" y="223" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">互動輸入版</text>
    <text x="845" y="285" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#c56f00">角色名稱：Nova</text><text x="845" y="320" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#c56f00">金幣：80</text>
    <text x="970" y="395" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">while + input() 收集資料</text><text x="970" y="435" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">先檢查空資料再平均</text>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">每一層只加入一種新功能；前一層的計算方式可以繼續使用。</text>
</svg>
