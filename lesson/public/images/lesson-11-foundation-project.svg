<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">把工具組合起來，完成一個小作品</title><desc id="desc">迷你成績管理器會把輸入、保存、重複處理和顯示結果組合使用。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">把工具組合起來，完成一個小作品</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">迷你成績管理器：從輸入，到保存、計算和顯示結果。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="85" cy="205" r="19" fill="#187b71"/><text x="85" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">1</text><text x="180.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">取得輸入</text><text x="180.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">input()</text><text x="180.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">輸入分數或 q</text></g>
<g filter="url(#shadow)"><rect x="345" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="345" y="175" width="250" height="58" rx="20" fill="#8b5cf6"/><circle cx="375" cy="205" r="19" fill="#8b5cf6"/><text x="375" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">2</text><text x="470.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">保存資料</text><text x="470.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#8b5cf6">scores.append()</text><text x="470.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">加入列表</text></g>
<g filter="url(#shadow)"><rect x="635" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="635" y="175" width="250" height="58" rx="20" fill="#d78b1c"/><circle cx="665" cy="205" r="19" fill="#d78b1c"/><text x="665" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">3</text><text x="760.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">重複處理</text><text x="760.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#d78b1c">while / for</text><text x="760.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">收集並逐一計算</text></g>
<g filter="url(#shadow)"><rect x="925" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="925" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="955" cy="205" r="19" fill="#187b71"/><text x="955" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">4</text><text x="1050.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">顯示結果</text><text x="1050.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">if / print()</text><text x="1050.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">平均分與等級</text></g>
<rect x="160" y="500" width="880" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="540" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="24" fill="#365c58">小作品不是新魔法，而是把你已經學過的工具按需要組合起來。</text></svg>
