<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">分類：從已有類別選出一個結果</title>
  <desc id="desc">以氣溫和服裝建議為例，顯示已知的長袖與短袖資料，以及二十點五度的新資料會被分類為短袖。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbf7"/><stop offset="1" stop-color="#fff5ed"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#295448" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="101" cy="104" r="160" fill="#c8eddb" opacity=".44"/><circle cx="1124" cy="548" r="171" fill="#ffdbbb" opacity=".47"/>
  <text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#1f4f41">分類：從已有類別選出一個結果</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#526f65">這個簡化例子用氣溫作輸入，從「長袖／短袖」兩個類別中作選擇。</text>
  <g filter="url(#shadow)"><rect x="56" y="163" width="637" height="340" rx="25" fill="#fffdf9"/><rect x="738" y="163" width="406" height="340" rx="25" fill="#fffdf9"/></g>
  <text x="96" y="214" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#315b4d">1　已有的分類資料</text>
  <line x1="120" y1="363" x2="637" y2="363" stroke="#b7c9c1" stroke-width="4" stroke-linecap="round"/>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" fill="#597468" font-size="17"><text x="115" y="397">10°C</text><text x="205" y="397">15°C</text><text x="296" y="397">20°C</text><text x="387" y="397">25°C</text><text x="478" y="397">30°C</text><text x="570" y="397">35°C</text><text x="281" y="441">氣溫</text></g>
  <g stroke="#87a99a" stroke-width="2"><path d="M120 354V372M211 354V372M302 354V372M393 354V372M484 354V372M575 354V372"/></g>
  <g fill="#5375b4" stroke="#fff" stroke-width="4"><circle cx="157" cy="305" r="12"/><circle cx="211" cy="305" r="12"/><circle cx="302" cy="305" r="12"/></g><text x="211" y="265" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" font-weight="700" fill="#426096">長袖</text>
  <g fill="#dc8054" stroke="#fff" stroke-width="4"><circle cx="329" cy="305" r="12"/><circle cx="347" cy="305" r="12"/><circle cx="548" cy="305" r="12"/></g><text x="493" y="265" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" font-weight="700" fill="#b65e36">短袖</text>
  <text x="770" y="214" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#315b4d">2　新資料：20.5°C</text>
  <rect x="785" y="246" width="312" height="69" rx="20" fill="#e8f5ec" stroke="#69a77d" stroke-width="3"/><text x="941" y="289" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="31" font-weight="700" fill="#36704c">[[20.5]]</text>
  <text x="941" y="356" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#577366">KNN 參考最接近的 3 筆已知資料</text>
  <rect x="785" y="388" width="312" height="73" rx="20" fill="#fff0e8" stroke="#dc8054" stroke-width="3"/><text x="941" y="432" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="24" font-weight="700" fill="#ae5632">模型建議：短袖</text>
  <rect x="155" y="546" width="890" height="43" rx="15" fill="#fff" opacity=".89"/><text x="600" y="575" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#526f65">分類的答案是類別；KNN 的設定和已有資料都會影響結果。</text>
</svg>
