<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">從統計到分組</title><desc id="desc">用統計函式和 groupby 比較全班及不同班別。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">從統計到分組</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">同一份資料，可以從全班、個別分數和不同班別三個角度查看。</text><g filter="url(#shadow)"><rect x="65" y="170" width="330" height="270" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="65" y="170" width="330" height="52" rx="20" fill="#187b71"/><text x="230.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">全班</text></g><text x="230" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="29" font-weight="700" fill="#187b71">mean()</text><text x="230" y="320" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">平均分 75.0</text><text x="230" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">整體表現</text><g filter="url(#shadow)"><rect x="435" y="170" width="330" height="270" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="435" y="170" width="330" height="52" rx="20" fill="#8b5cf6"/><text x="600.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">一欄資料</text></g><text x="600" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="29" font-weight="700" fill="#8b5cf6">max()</text><text x="600" y="320" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">最高分 91</text><text x="600" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">找出範圍</text><g filter="url(#shadow)"><rect x="805" y="170" width="330" height="270" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="805" y="170" width="330" height="52" rx="20" fill="#d78b1c"/><text x="970.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">分組比較</text></g><text x="970" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="25" font-weight="700" fill="#d78b1c">groupby()</text><text x="970" y="320" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">F4A / F4B</text><text x="970" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">比較不同群組</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">先說清楚問題，再選擇統計方式。</text></svg>
