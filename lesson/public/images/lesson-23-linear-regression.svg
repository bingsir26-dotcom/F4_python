<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">線性迴歸以整體趨勢估計房價</title>
  <desc id="desc">一張散點圖顯示虛構房屋面積和房價資料，紅線為整體趨勢，紫色點表示七十平方米房屋的估計價格。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f5ff"/><stop offset="1" stop-color="#effaff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#452865" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="108" cy="102" r="150" fill="#e2d0ff" opacity=".42"/><circle cx="1120" cy="548" r="172" fill="#bee8f1" opacity=".5"/>
  <text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#35204f">線性迴歸：用整體趨勢作估計</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#665a78">資料點不必全在直線上；直線是根據所有已知資料作出的近似。</text>
  <g filter="url(#shadow)"><rect x="91" y="151" width="770" height="378" rx="24" fill="#fffdfb"/><rect x="900" y="151" width="226" height="378" rx="24" fill="#fffdfb"/></g>
  <g stroke="#dcd5e6" stroke-width="2"><path d="M181 202V457H792"/><path d="M181 406H792M181 355H792M181 304H792M181 253H792" stroke-dasharray="6 8"/><path d="M283 202V457M385 202V457M487 202V457M589 202V457M691 202V457" stroke-dasharray="6 8"/></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="16" fill="#73677f"><text x="146" y="462">0</text><text x="131" y="411">200</text><text x="131" y="360">400</text><text x="131" y="309">600</text><text x="131" y="258">800</text><text x="171" y="487">30</text><text x="273" y="487">45</text><text x="375" y="487">60</text><text x="477" y="487">75</text><text x="579" y="487">90</text><text x="636" y="515">面積（平方米）</text><text x="106" y="195">房價（萬）</text></g>
  <path d="M181 422 L283 384 L385 346 L487 308 L589 270 L691 232" fill="none" stroke="#d45752" stroke-width="6" stroke-linecap="round"/>
  <g fill="#2f7991" stroke="#fff" stroke-width="4"><circle cx="181" cy="428" r="10"/><circle cx="283" cy="400" r="10"/><circle cx="385" cy="324" r="10"/><circle cx="487" cy="306" r="10"/><circle cx="589" cy="258" r="10"/></g>
  <g><circle cx="453" cy="319" r="13" fill="#8a4ba6" stroke="#fff" stroke-width="5"/><circle cx="453" cy="319" r="22" fill="none" stroke="#8a4ba6" stroke-width="2" opacity=".55"/></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#50455e"><text x="913" y="207" font-size="23" font-weight="700">圖中有甚麼？</text><circle cx="925" cy="253" r="8" fill="#2f7991"/><text x="947" y="259">已知房屋資料</text><line x1="916" y1="300" x2="935" y2="300" stroke="#d45752" stroke-width="5" stroke-linecap="round"/><text x="947" y="306">模型趨勢線</text><circle cx="925" cy="347" r="9" fill="#8a4ba6"/><text x="947" y="353">70 m² 的估計</text><text x="913" y="412" font-size="17" fill="#796d83">相同面積的房屋</text><text x="913" y="441" font-size="17" fill="#796d83">仍可能因地點、屋齡、</text><text x="913" y="470" font-size="17" fill="#796d83">交通等因素而不同價。</text></g>
  <rect x="147" y="555" width="907" height="38" rx="15" fill="#fff" opacity=".88"/><text x="600" y="581" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#665a78">趨勢線幫助我們作估計；它不會把所有未放入資料的因素變得準確。</text>
</svg>
