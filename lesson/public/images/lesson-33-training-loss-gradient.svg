<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">模型訓練時 loss 逐步下降</title>
  <desc id="desc">一個線性模型反覆預測、計算 loss、清除梯度和更新參數，表格與折線圖顯示 loss 下降。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="46" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">訓練迴圈：每一輪都檢查錯誤，再更新模型</text>
  <text x="46" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">loss 越小，表示模型在這批訓練資料上的預測通常越接近答案。</text>
  <rect x="42" y="130" width="330" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="172" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">每輪固定五步</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#334155">
    <circle cx="82" cy="215" r="15" fill="#2563eb"/><text x="77" y="221" font-size="14" font-weight="700" fill="#fff">1</text><text x="112" y="221">模型作預測</text>
    <circle cx="82" cy="255" r="15" fill="#0f766e"/><text x="77" y="261" font-size="14" font-weight="700" fill="#fff">2</text><text x="112" y="261">計算 loss</text>
    <circle cx="82" cy="295" r="15" fill="#d97706"/><text x="77" y="301" font-size="14" font-weight="700" fill="#fff">3</text><text x="112" y="301">清除舊梯度</text>
    <circle cx="82" cy="335" r="15" fill="#db2777"/><text x="77" y="341" font-size="14" font-weight="700" fill="#fff">4</text><text x="112" y="341">計算調整方向</text>
    <circle cx="82" cy="375" r="15" fill="#7c3aed"/><text x="77" y="381" font-size="14" font-weight="700" fill="#fff">5</text><text x="112" y="381">更新參數</text>
  </g>
  <rect x="414" y="130" width="504" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="448" y="172" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#334155">loss 記錄：y = 2x + 1</text>
  <g stroke="#e2e8f0" stroke-width="1"><path d="M486 210H860M486 260H860M486 310H860M486 360H860"/><path d="M540 195V390M620 195V390M700 195V390M780 195V390M860 195V390"/></g>
  <path d="M486 195V390H860" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="520,218 600,280 680,323 760,352 840,370" fill="none" stroke="#2563eb" stroke-width="5"/>
  <g fill="#2563eb"><circle cx="520" cy="218" r="6"/><circle cx="600" cy="280" r="6"/><circle cx="680" cy="323" r="6"/><circle cx="760" cy="352" r="6"/><circle cx="840" cy="370" r="6"/></g>
  <text x="495" y="414" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">訓練輪數</text>
  <text x="448" y="208" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">loss</text>
  <text x="706" y="222" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">由大變小</text>
</svg>
