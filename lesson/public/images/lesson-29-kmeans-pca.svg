<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">K-Means：由相似資料找群組</title>
  <desc id="desc">六筆沒有標籤的二維資料被分成兩群。藍色和橙色資料點各有一個紅色叉號表示群組中心。</desc>
  <rect width="960" height="520" fill="#f8fbff"/>
  <text x="50" y="62" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#172554">K-Means：由相似資料找群組</text>
  <text x="50" y="98" font-family="system-ui, sans-serif" font-size="19" fill="#475569">資料原本沒有標籤；模型按相近程度把它們分組。</text>
  <rect x="48" y="130" width="560" height="338" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="78" y="170" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#334155">六筆未標籤資料</text>
  <text x="78" y="202" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">每一點可代表一首歌的兩個數值特徵</text>
  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M130 250H540M130 300H540M130 350H540M130 400H540"/>
    <path d="M180 225V425M260 225V425M340 225V425M420 225V425M500 225V425"/>
  </g>
  <path d="M130 225V425H540" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="476" y="451" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">特徵 1</text>
  <text x="76" y="244" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">特徵 2</text>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="4">
    <circle cx="185" cy="376" r="11"/><circle cx="225" cy="341" r="11"/><circle cx="270" cy="365" r="11"/>
  </g>
  <g fill="#f97316" stroke="#ffffff" stroke-width="4">
    <circle cx="415" cy="276" r="11"/><circle cx="458" cy="247" r="11"/><circle cx="502" cy="282" r="11"/>
  </g>
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M214 350l18 18M232 350l-18 18"/><path d="M448 258l18 18M466 258l-18 18"/>
  </g>
  <text x="162" y="412" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">群組 A</text>
  <text x="432" y="318" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#c2410c">群組 B</text>
  <rect x="645" y="130" width="267" height="338" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <circle cx="684" cy="183" r="18" fill="#2563eb"/><text x="678" y="190" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="718" y="179" font-size="19" font-weight="700" fill="#1e3a8a">沒有預先答案</text>
    <text x="678" y="213" font-size="16" fill="#475569">不是「答對」或「答錯」；</text><text x="678" y="237" font-size="16" fill="#475569">先觀察資料本身。</text>
    <circle cx="684" cy="291" r="18" fill="#0f766e"/><text x="678" y="298" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="718" y="287" font-size="19" font-weight="700" fill="#134e4a">設定分成兩群</text>
    <text x="678" y="321" font-size="16" fill="#475569">K = 2，模型嘗試把</text><text x="678" y="345" font-size="16" fill="#475569">相近資料放在一起。</text>
    <g stroke="#dc2626" stroke-width="4" stroke-linecap="round"><path d="M676 387l14 14M690 387l-14 14"/></g>
    <text x="718" y="393" font-size="19" font-weight="700" fill="#991b1b">叉號是群組中心</text>
    <text x="678" y="425" font-size="16" fill="#475569">它代表該群的中心位置。</text>
  </g>
</svg>
