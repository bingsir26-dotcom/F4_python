<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">資料清洗前後</title><desc id="desc">資料表中常見的缺失值與不一致寫法。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">資料清洗前後</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">清洗不是按一個按鈕；先找問題，再選擇合理的處理方法。</text><g filter="url(#shadow)"><rect x="70" y="170" width="470" height="270" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="70" y="170" width="470" height="52" rx="20" fill="#d78b1c"/><text x="305.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">清洗前：需要檢查</text></g><text x="305" y="250" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" fill="#d78b1c">英文：82、空白、88</text><text x="305" y="310" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" fill="#d78b1c">班別：F4A、F4 A、F4B</text><text x="305" y="385" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">缺失值、不一致寫法</text><g filter="url(#shadow)"><rect x="660" y="170" width="470" height="270" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="660" y="170" width="470" height="52" rx="20" fill="#187b71"/><text x="895.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">清洗後：可以分析</text></g><text x="895" y="250" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="23" font-weight="700" fill="#187b71">英文：82、80、88</text><text x="895" y="310" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700" fill="#187b71">班別：F4A、F4A、F4B</text><text x="895" y="385" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">補值、統一名稱</text><text x="600" y="480" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">先用 isna() 找出空白，再決定 dropna() 或 fillna()。</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">處理資料前，必須理解空白和錯誤文字代表甚麼。</text></svg>
