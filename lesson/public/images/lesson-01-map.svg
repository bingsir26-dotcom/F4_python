<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">第 1 課概念總覽</title>
  <desc id="desc">Python 程式由上到下執行，print 顯示結果，文字和數字不同，變數保存和更新資料。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fdfa"/><stop offset="1" stop-color="#fef7e7"/></linearGradient><filter id="sh" x="-12%" y="-16%" width="124%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b5c60" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/><text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="42" font-weight="700" fill="#143f43">第 1 課：四個你已經會用的工具</text>
  <g filter="url(#sh)"><g transform="translate(72 155)"><rect width="245" height="290" rx="22" fill="#fffdf8" stroke="#75b9ae" stroke-width="4"/><circle cx="122" cy="63" r="36" fill="#11756d"/><text x="122" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="29" font-weight="700" fill="#fff">1</text><text x="122" y="142" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="27" font-weight="700" fill="#174843">由上到下</text><text x="122" y="186" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">Python 依照你寫的</text><text x="122" y="220" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">先後次序執行指令。</text><text x="122" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#0f766e">A、B、C</text></g>
  <g transform="translate(347 155)"><rect width="245" height="290" rx="22" fill="#fffdf8" stroke="#75b9ae" stroke-width="4"/><circle cx="122" cy="63" r="36" fill="#11756d"/><text x="122" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="29" font-weight="700" fill="#fff">2</text><text x="122" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#174843">print()</text><text x="122" y="186" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">把文字、數字或答案</text><text x="122" y="220" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">顯示在輸出區。</text><text x="122" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#0f766e">print(15)</text></g>
  <g transform="translate(622 155)"><rect width="245" height="290" rx="22" fill="#fffdf8" stroke="#75b9ae" stroke-width="4"/><circle cx="122" cy="63" r="36" fill="#d78b1c"/><text x="122" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="29" font-weight="700" fill="#fff">3</text><text x="122" y="142" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="27" font-weight="700" fill="#174843">文字或數字？</text><text x="122" y="186" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">有引號的是文字；</text><text x="122" y="220" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">沒有引號的可計算。</text><text x="122" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#a66108">&quot;10&quot; / 10</text></g>
  <g transform="translate(897 155)"><rect width="245" height="290" rx="22" fill="#fffdf8" stroke="#75b9ae" stroke-width="4"/><circle cx="122" cy="63" r="36" fill="#d78b1c"/><text x="122" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="29" font-weight="700" fill="#fff">4</text><text x="122" y="142" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="27" font-weight="700" fill="#174843">變數</text><text x="122" y="186" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">替資料命名，之後可以</text><text x="122" y="220" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#59716b">讀取或放入新資料。</text><text x="122" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#a66108">hp = hp - 20</text></g></g>
  <path d="M161 510H1039" stroke="#0f766e" stroke-width="4" stroke-dasharray="9 12"/><text x="600" y="576" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#365c58">你現在已經能寫出「有輸出、有資料、有計算」的小程式。</text>
</svg>
