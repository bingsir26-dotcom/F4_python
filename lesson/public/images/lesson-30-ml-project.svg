<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">機器學習小專題的五項報告內容</title>
  <desc id="desc">以鳶尾花分類為例，一份完整模型報告交代問題、資料、方法、測試結果以及限制與下一步。</desc>
  <rect width="960" height="520" fill="#f8fbff"/>
  <text x="48" y="61" font-family="system-ui, sans-serif" font-size="31" font-weight="700" fill="#172554">把模型結果說清楚：小專題的五個部分</text>
  <text x="48" y="98" font-family="system-ui, sans-serif" font-size="19" fill="#475569">例子：用花瓣和花萼數據，辨認鳶尾花的種類。</text>
  <rect x="48" y="128" width="864" height="334" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <rect x="75" y="155" width="244" height="122" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="105" cy="187" r="17" fill="#2563eb"/><text x="99" y="194" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="134" y="184" font-size="20" font-weight="700" fill="#1e3a8a">問題</text>
    <text x="99" y="220" font-size="16" fill="#334155">要辨認哪一種鳶尾花？</text><text x="99" y="246" font-size="16" fill="#334155">先說清楚模型回答甚麼。</text>
    <rect x="358" y="155" width="244" height="122" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="388" cy="187" r="17" fill="#059669"/><text x="382" y="194" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="417" y="184" font-size="20" font-weight="700" fill="#065f46">資料</text>
    <text x="382" y="220" font-size="16" fill="#334155">花萼長度、花瓣長度等</text><text x="382" y="246" font-size="16" fill="#334155">資料從哪裡來？有甚麼欄位？</text>
    <rect x="641" y="155" width="244" height="122" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="671" cy="187" r="17" fill="#d97706"/><text x="665" y="194" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="700" y="184" font-size="20" font-weight="700" fill="#92400e">方法</text>
    <text x="665" y="220" font-size="16" fill="#334155">KNN 分類模型，k = 5</text><text x="665" y="246" font-size="16" fill="#334155">訓練與測試怎樣分開？</text>
    <rect x="215" y="310" width="244" height="122" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
    <circle cx="245" cy="342" r="17" fill="#db2777"/><text x="239" y="349" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="274" y="339" font-size="20" font-weight="700" fill="#9d174d">測試結果</text>
    <text x="239" y="375" font-size="16" fill="#334155">測試準確率：94.7%</text><text x="239" y="401" font-size="16" fill="#334155">真正答案和預測是否一致？</text>
    <rect x="498" y="310" width="244" height="122" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="528" cy="342" r="17" fill="#7c3aed"/><text x="522" y="349" font-size="17" font-weight="700" fill="#fff">5</text>
    <text x="557" y="339" font-size="20" font-weight="700" fill="#5b21b6">限制與下一步</text>
    <text x="522" y="375" font-size="16" fill="#334155">資料少或不完整會影響結果。</text><text x="522" y="401" font-size="16" fill="#334155">模型預測不是事實。</text>
  </g>
  <rect x="226" y="481" width="508" height="25" rx="12" fill="#e0f2fe"/>
  <text x="281" y="500" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">完整作品不只顯示準確率，也要交代它的局限。</text>
</svg>
