<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">同一組資料的兩種分類方法</title><desc id="desc">KNN 以二十一度附近的資料投票；Logistic Regression 根據整體資料分界作分類。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff9ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="s" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#315f6f" flood-opacity=".13"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="83" cy="91" r="146" fill="#c9edff" opacity=".45"/><circle cx="1134" cy="558" r="165" fill="#ffe0b9" opacity=".48"/>
<text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#244a5b">同一組資料，兩種分類方法</text><text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#596c73">兩個模型都回答：21°C 的建議是甚麼？</text>
<g filter="url(#s)"><rect x="65" y="153" width="500" height="357" rx="26" fill="#fffdf9"/><rect x="635" y="153" width="500" height="357" rx="26" fill="#fffdf9"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700"><text x="100" y="205" font-size="25" fill="#2f718a">1　KNN：看附近 3 筆資料</text><text x="670" y="205" font-size="25" fill="#ad6332">2　Logistic Regression：看整體分界</text></g>
<g stroke="#aebfc5" stroke-width="4" stroke-linecap="round"><line x1="121" y1="364" x2="510" y2="364"/><line x1="691" y1="364" x2="1080" y2="364"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="16" fill="#63757b"><text x="110" y="401">10°C</text><text x="194" y="401">15°C</text><text x="278" y="401">20°C</text><text x="362" y="401">25°C</text><text x="446" y="401">30°C</text><text x="680" y="401">10°C</text><text x="764" y="401">15°C</text><text x="848" y="401">20°C</text><text x="932" y="401">25°C</text><text x="1016" y="401">30°C</text></g>
<g fill="#5478b7" stroke="#fff" stroke-width="4"><circle cx="160" cy="308" r="12"/><circle cx="211" cy="308" r="12"/><circle cx="262" cy="308" r="12"/></g><text x="211" y="267" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" font-weight="700" fill="#49679d">長袖</text><g fill="#de8054" stroke="#fff" stroke-width="4"><circle cx="347" cy="308" r="12"/><circle cx="398" cy="308" r="12"/><circle cx="449" cy="308" r="12"/></g><text x="398" y="267" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" font-weight="700" fill="#b85e37">短袖</text><circle cx="313" cy="362" r="13" fill="#7d4da0" stroke="#fff" stroke-width="5"/><text x="313" y="437" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" font-weight="700" fill="#6b4687">新資料：21°C</text><text x="315" y="476" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#4e6d61">附近三筆：長袖、短袖、短袖</text>
<g fill="#5478b7" stroke="#fff" stroke-width="4"><circle cx="730" cy="308" r="12"/><circle cx="781" cy="308" r="12"/><circle cx="832" cy="308" r="12"/></g><g fill="#de8054" stroke="#fff" stroke-width="4"><circle cx="917" cy="308" r="12"/><circle cx="968" cy="308" r="12"/><circle cx="1019" cy="308" r="12"/></g><line x1="874" y1="238" x2="874" y2="390" stroke="#d79c42" stroke-width="5" stroke-dasharray="8 8"/><text x="874" y="225" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="17" fill="#a66710">大致分界</text><circle cx="883" cy="362" r="13" fill="#7d4da0" stroke="#fff" stroke-width="5"/><text x="883" y="437" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" font-weight="700" fill="#6b4687">新資料：21°C</text><text x="883" y="476" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#7b623c">根據整體分界選出類別</text>
<rect x="346" y="545" width="508" height="47" rx="16" fill="#fff" opacity=".88"/><text x="600" y="576" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" fill="#4d6367">本例中兩者都輸出「短袖」，但判斷方式不同。</text></svg>
