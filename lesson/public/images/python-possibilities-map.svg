  <text x="603" y="632" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="17" fill="#475569">B</text>
  <text x="661" y="632" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="17" fill="#475569">C</text>
  <path d="M523 416 C557 370 583 385 603 351 S650 380 682 333" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="523" cy="416" r="7" fill="#f59e0b"/><circle cx="603" cy="351" r="7" fill="#f59e0b"/><circle cx="682" cy="333" r="7" fill="#f59e0b"/>
  <text x="600" y="698" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#475569">把問卷或成績趨勢畫出來</text>

  <rect x="795" y="215" width="330" height="94" rx="30" fill="#7c3aed"/>
  <text x="960" y="273" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#ffffff">機器學習初探</text>
  <circle cx="892" cy="393" r="23" fill="#c4b5fd"/><circle cx="962" cy="371" r="23" fill="#a78bfa"/><circle cx="1028" cy="418" r="23" fill="#c4b5fd"/>
  <circle cx="910" cy="471" r="23" fill="#fca5a5"/><circle cx="982" cy="482" r="23" fill="#fb7185"/><circle cx="1044" cy="501" r="23" fill="#fca5a5"/>
  <path d="M831 552 C884 493 943 480 1087 350" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
  <path d="M831 552 C894 529 980 519 1087 553" fill="none" stroke="#e11d48" stroke-width="7" stroke-linecap="round"/>
  <rect x="842" y="621" width="238" height="54" rx="15" fill="#f5f3ff"/>
  <text x="961" y="655" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" font-weight="700" fill="#6d28d9">根據例子分成 A / B</text>

  <text x="600" y="796" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="21" fill="#64748b">機器學習的答案不是魔法：它需要資料、測試，也可能出錯。</text>
</svg>
