  <text x="240" y="575" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#475569">平均分</text>
  <text x="240" y="609" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#0f766e">86</text>

  <rect x="435" y="215" width="330" height="94" rx="30" fill="#1d4ed8"/>
  <text x="600" y="273" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#ffffff">圖表與溝通</text>
  <line x1="494" y1="593" x2="704" y2="593" stroke="#64748b" stroke-width="4"/>
  <line x1="494" y1="593" x2="494" y2="357" stroke="#64748b" stroke-width="4"/>
  <rect x="526" y="467" width="38" height="126" rx="8" fill="#60a5fa"/>
  <rect x="584" y="397" width="38" height="196" rx="8" fill="#2563eb"/>
