<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Python 可以整理資料、畫圖和作出分類預測</title>
  <desc id="desc">三張卡片展示 Python 把資料整理成計算結果、圖表及 A B 分類模型的概念。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f766e" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1040" cy="105" r="190" fill="#bae6fd" opacity=".62"/>
  <circle cx="105" cy="825" r="200" fill="#bbf7d0" opacity=".42"/>
  <text x="600" y="95" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="39" font-weight="700" fill="#0f3e48">Python 讓資料變成看得懂的答案</text>
  <text x="600" y="143" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="24" fill="#475569">整理、計算、圖表、從例子學習分類</text>

  <g filter="url(#shadow)">
    <rect x="75" y="215" width="330" height="485" rx="30" fill="#ffffff"/>
    <rect x="435" y="215" width="330" height="485" rx="30" fill="#ffffff"/>
    <rect x="795" y="215" width="330" height="485" rx="30" fill="#ffffff"/>
  </g>

  <rect x="75" y="215" width="330" height="94" rx="30" fill="#0f766e"/>
  <text x="240" y="273" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="28" font-weight="700" fill="#ffffff">整理與計算</text>
  <rect x="113" y="350" width="254" height="38" rx="9" fill="#d1fae5"/>
  <rect x="113" y="402" width="254" height="38" rx="9" fill="#e2e8f0"/>
  <rect x="113" y="454" width="254" height="38" rx="9" fill="#d1fae5"/>
  <line x1="195" y1="350" x2="195" y2="492" stroke="#94a3b8" stroke-width="3"/>
  <line x1="280" y1="350" x2="280" y2="492" stroke="#94a3b8" stroke-width="3"/>
  <text x="154" y="376" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#0f172a">姓名</text>
  <text x="237" y="376" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#0f172a">分數</text>
  <text x="323" y="376" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#0f172a">出席</text>
  <text x="145" y="428" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">Kai</text>
  <text x="237" y="428" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">82</text>
  <text x="323" y="428" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">✓</text>
  <text x="145" y="480" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">Ming</text>
  <text x="237" y="480" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">90</text>
  <text x="323" y="480" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#334155">✓</text>
