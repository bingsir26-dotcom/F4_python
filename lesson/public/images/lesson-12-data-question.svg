<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">資料、問題、程式處理與結論</title>
  <desc id="desc">同一串遊戲回合金幣資料，可以先提出問題，再由程式計算，最後寫出有根據的結論。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f4c5c" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="90" cy="530" r="150" fill="#bae6fd" opacity=".48"/><circle cx="1120" cy="70" r="145" fill="#bbf7d0" opacity=".48"/>
  <text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="40" font-weight="700" fill="#123f43">資料分析：由問題得到有根據的結論</text>
  <text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="23" fill="#365c58">不要先找複雜工具；先想清楚資料可以回答甚麼問題。</text>
  <g filter="url(#shadow)">
    <rect x="60" y="175" width="250" height="300" rx="24" fill="#fff" stroke="#2563eb" stroke-width="4"/><circle cx="105" cy="220" r="24" fill="#2563eb"/><text x="105" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="185" y="228" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="26" font-weight="700" fill="#123f43">資料</text><text x="185" y="300" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#1d4ed8">[78, 55, 91,</text><text x="185" y="332" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="19" fill="#1d4ed8">72, 84]</text><text x="185" y="405" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">五個回合金幣紀錄</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="335" y="175" width="250" height="300" rx="24" fill="#fff" stroke="#0f9f8c" stroke-width="4"/><circle cx="380" cy="220" r="24" fill="#0f9f8c"/><text x="380" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="460" y="228" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="26" font-weight="700" fill="#123f43">問題</text><text x="460" y="302" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" fill="#0f766e">平均每回合有</text><text x="460" y="334" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" fill="#0f766e">多少金幣？</text><text x="460" y="405" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">問題要清楚、可回答</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="175" width="250" height="300" rx="24" fill="#fff" stroke="#d78b1c" stroke-width="4"/><circle cx="655" cy="220" r="24" fill="#d78b1c"/><text x="655" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="735" y="228" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="26" font-weight="700" fill="#123f43">程式處理</text><text x="735" y="302" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#b45309">total_gold /</text><text x="735" y="334" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="17" fill="#b45309">len(gold_values)</text><text x="735" y="405" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">先加總，再除以回合數</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="885" y="175" width="250" height="300" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="4"/><circle cx="930" cy="220" r="24" fill="#7c3aed"/><text x="930" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="1010" y="228" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="26" font-weight="700" fill="#123f43">結論</text><text x="1010" y="302" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" fill="#6d28d9">平均金幣是</text><text x="1010" y="334" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="26" font-weight="700" fill="#6d28d9">76.0</text><text x="1010" y="405" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">結論要對應原本問題</text>
  </g>
  <text x="600" y="555" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#365c58">同一份資料還能回答其他問題，例如「有多少回合達到 60 枚金幣？」</text>
</svg>
