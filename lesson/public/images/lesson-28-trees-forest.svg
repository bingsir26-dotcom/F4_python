<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">決策樹和隨機森林</title><desc id="desc">一棵決策樹按雨量條件得到戶外或室內結果，多棵樹的結果可綜合投票。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2fbf8"/><stop offset="1" stop-color="#f8f3ff"/></linearGradient><filter id="s" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2d5a48" flood-opacity=".14"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="83" cy="93" r="148" fill="#c7edda" opacity=".45"/><circle cx="1127" cy="554" r="165" fill="#e1d2ff" opacity=".46"/><text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#285343">由條件規則到多棵樹投票</text><text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#597166">決策樹像 if／else；Random Forest 綜合多個略有不同的判斷。</text>
<g filter="url(#s)"><rect x="61" y="154" width="500" height="360" rx="25" fill="#fffdf9"/><rect x="639" y="154" width="500" height="360" rx="25" fill="#fffdf9"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700"><text x="95" y="207" font-size="25" fill="#35715a">1　Decision Tree：可讀的條件規則</text><text x="672" y="207" font-size="25" fill="#7b5d9a">2　Random Forest：綜合多棵樹</text></g>
<g stroke="#789989" stroke-width="4" fill="none" stroke-linecap="round"><line x1="309" y1="288" x2="192" y2="366"/><line x1="309" y1="288" x2="426" y2="366"/></g><rect x="225" y="239" width="168" height="57" rx="18" fill="#e4f3e9" stroke="#4f9a70" stroke-width="3"/><text x="309" y="275" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" font-weight="700" fill="#397050">雨量 ≤ 0.5？</text><rect x="111" y="367" width="163" height="63" rx="18" fill="#e7eefb" stroke="#5c83be" stroke-width="3"/><text x="192" y="406" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" font-weight="700" fill="#486fa8">戶外</text><rect x="344" y="367" width="163" height="63" rx="18" fill="#fff0e8" stroke="#d67d57" stroke-width="3"/><text x="426" y="406" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" font-weight="700" fill="#b55c39">室內</text><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="17" fill="#5f756b"><text x="163" y="343">是</text><text x="443" y="343">否</text></g>
<g stroke="#a69bb9" stroke-width="3" fill="none"><path d="M758 290V335M758 335H716M758 335H800M880 290V335M880 335H838M880 335H922M1002 290V335M1002 335H960M1002 335H1044"/></g><g fill="#f0ebfb" stroke="#8064ae" stroke-width="2"><rect x="722" y="248" width="72" height="43" rx="13"/><rect x="844" y="248" width="72" height="43" rx="13"/><rect x="966" y="248" width="72" height="43" rx="13"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700" font-size="17" text-anchor="middle" fill="#70558e"><text x="758" y="276">樹 1</text><text x="880" y="276">樹 2</text><text x="1002" y="276">樹 3</text></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="16" text-anchor="middle"><text x="716" y="365" fill="#486fa8">戶外</text><text x="800" y="365" fill="#b55c39">室內</text><text x="838" y="365" fill="#486fa8">戶外</text><text x="922" y="365" fill="#486fa8">戶外</text><text x="960" y="365" fill="#b55c39">室內</text><text x="1044" y="365" fill="#486fa8">戶外</text></g><rect x="796" y="410" width="291" height="58" rx="18" fill="#efe8fa" stroke="#8064ae" stroke-width="3"/><text x="942" y="447" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" font-weight="700" fill="#70558e">綜合結果：戶外</text><rect x="197" y="550" width="806" height="42" rx="15" fill="#fff" opacity=".88"/><text x="600" y="578" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#597166">樹的規則仍要配合資料和測試檢查，不能取代真實情境判斷。</text></svg>
