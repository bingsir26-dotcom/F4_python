<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">模型評估要保留未見資料</title><desc id="desc">鳶尾花資料分成訓練和測試兩部分，測試資料的真正答案與預測答案用來計算準確率。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbf4"/><stop offset="1" stop-color="#f5f2ff"/></linearGradient><filter id="s" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#315743" flood-opacity=".13"/></filter></defs><rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="85" cy="82" r="145" fill="#ccebd4" opacity=".47"/><circle cx="1125" cy="559" r="164" fill="#ded3ff" opacity=".47"/><text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#28513e">模型評估：留下未見資料作測驗</text><text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#597167">訓練集用來學習；測試集只在最後比較預測和真正答案。</text>
<g filter="url(#s)"><rect x="55" y="160" width="290" height="338" rx="24" fill="#fffdf9"/><rect x="385" y="160" width="350" height="338" rx="24" fill="#fffdf9"/><rect x="775" y="160" width="370" height="338" rx="24" fill="#fffdf9"/></g><g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700"><text x="88" y="211" font-size="24" fill="#397154">1　150 筆公開花朵資料</text><text x="418" y="211" font-size="24" fill="#5574a0">2　分成兩部分</text><text x="808" y="211" font-size="24" fill="#9a5f6f">3　只在最後測試</text></g>
<g fill="#6bad84"><rect x="93" y="243" width="69" height="48" rx="12"/><rect x="177" y="243" width="69" height="48" rx="12"/><rect x="93" y="306" width="69" height="48" rx="12"/><rect x="177" y="306" width="69" height="48" rx="12"/><rect x="93" y="369" width="69" height="48" rx="12"/><rect x="177" y="369" width="69" height="48" rx="12"/></g><g fill="#fff" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="16" text-anchor="middle"><text x="127" y="273">花朵</text><text x="211" y="273">花朵</text><text x="127" y="336">花朵</text><text x="211" y="336">花朵</text><text x="127" y="399">花朵</text><text x="211" y="399">花朵</text></g>
<rect x="421" y="249" width="278" height="92" rx="18" fill="#dff0e6" stroke="#6bad84" stroke-width="3"/><text x="560" y="288" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="23" font-weight="700" fill="#327052">訓練集</text><text x="560" y="319" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#507366">約 112 筆，給模型學習</text><rect x="421" y="365" width="278" height="92" rx="18" fill="#e4eaff" stroke="#7397cf" stroke-width="3"/><text x="560" y="404" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="23" font-weight="700" fill="#466b9c">測試集</text><text x="560" y="435" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#52677f">約 38 筆，先不讓模型看</text>
<g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif"><text x="820" y="258" font-size="19" fill="#6e6270">真正答案</text><text x="986" y="258" font-size="19" fill="#6e6270">模型預測</text><g font-size="18" fill="#465761"><text x="820" y="306">花種 A</text><text x="820" y="352">花種 B</text><text x="820" y="398">花種 C</text><text x="986" y="306">花種 A</text><text x="986" y="352">花種 B</text><text x="986" y="398">花種 C</text></g><g fill="#54a470"><circle cx="942" cy="300" r="10"/><circle cx="942" cy="346" r="10"/><circle cx="942" cy="392" r="10"/></g></g><rect x="810" y="426" width="294" height="47" rx="15" fill="#fae2e7"/><text x="957" y="457" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" font-weight="700" fill="#9a4a60">準確率 = 答對比例</text><rect x="190" y="546" width="820" height="45" rx="16" fill="#fff" opacity=".88"/><text x="600" y="576" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#526e62">混淆矩陣會進一步告訴我們：答錯的資料主要落在哪些類別。</text></svg>
