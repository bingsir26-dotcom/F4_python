<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">print 函式把程式內容顯示在輸出區</title>
  <desc id="desc">從 Python 程式碼到 Python 執行，再到輸出區顯示結果的流程圖。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edfdfa"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#background)"/>
  <circle cx="80" cy="78" r="125" fill="#b7f4e4" opacity=".55"/><circle cx="1145" cy="570" r="175" fill="#c9e1ff" opacity=".55"/>
  <text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="40" font-weight="700" fill="#123f43">一行 print()，結果怎樣出現在畫面？</text>
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="365" height="290" rx="24" fill="#102a43"/>
    <rect x="55" y="155" width="365" height="48" rx="24" fill="#173c5b"/>
    <circle cx="89" cy="179" r="7" fill="#fb7185"/><circle cx="113" cy="179" r="7" fill="#fbbf24"/><circle cx="137" cy="179" r="7" fill="#34d399"/>
    <text x="238" y="184" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#d9f7ee">你的程式碼</text>
    <text x="237" y="327" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700"><tspan fill="#d9f7ee">print(</tspan><tspan fill="#fcd34d">&quot;你好！&quot;</tspan><tspan fill="#d9f7ee">)</tspan></text>
  </g>
  <path d="M452 300 H490" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="471" y="269" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" font-weight="700" fill="#0f766e">執行</text>
  <g filter="url(#shadow)">
    <circle cx="606" cy="300" r="103" fill="#0f766e"/>
    <path d="M566 282c0-24 18-39 40-39s40 15 40 39v37c0 24-18 39-40 39s-40-15-40-39z" fill="none" stroke="#e8fff8" stroke-width="11" stroke-linecap="round"/>
    <path d="M581 285h50M581 316h50" stroke="#e8fff8" stroke-width="11" stroke-linecap="round"/>
    <text x="606" y="440" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="25" font-weight="700" fill="#0b5857">Python</text>
  </g>
  <path d="M722 300 H806" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="764" y="269" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" font-weight="700" fill="#0f766e">顯示</text>
  <g filter="url(#shadow)">
    <rect x="835" y="155" width="310" height="290" rx="24" fill="#fffdf7" stroke="#0c5c62" stroke-width="5"/>
    <rect x="835" y="155" width="310" height="54" rx="22" fill="#e5f7f2"/>
    <text x="990" y="190" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" font-weight="700" fill="#0c5c62">輸出區</text>
    <text x="990" y="326" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="38" font-weight="700" fill="#173c3b">你好！</text>
    <path d="M893 359h194" stroke="#c9e7df" stroke-width="3"/>
    <text x="990" y="395" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="18" fill="#58716a">你看得到的結果</text>
  </g>
  <text x="600" y="548" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="27" fill="#365c58">print() 會把括號內的文字、數字或計算結果顯示在輸出區。</text>
</svg>
