<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Python 基礎測驗與錯誤分析概念圖</title><desc id="desc">讀碼、預測、改錯和測試四個基礎檢查方向。</desc><rect width="960" height="350" fill="#f8fbff"/><text x="40" y="64" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#1e293b">Python 基礎測驗與錯誤分析</text><text x="40" y="103" font-family="system-ui,sans-serif" font-size="19" fill="#64748b">由四個方向檢查自己是否真的理解</text><rect x="40" y="130" width="190" height="145" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="65" y="188" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">1 讀碼</text><text x="65" y="235" font-family="system-ui,sans-serif" font-size="18" fill="#475569">看懂每一行</text><rect x="265" y="130" width="190" height="145" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="290" y="188" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#166534">2 預測</text><text x="290" y="235" font-family="system-ui,sans-serif" font-size="18" fill="#475569">先猜再執行</text><rect x="490" y="130" width="190" height="145" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="515" y="188" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#92400e">3 改錯</text><text x="515" y="235" font-family="system-ui,sans-serif" font-size="18" fill="#475569">找原因、修正</text><rect x="715" y="130" width="190" height="145" rx="20" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/><text x="740" y="188" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#9d174d">4 測試</text><text x="740" y="235" font-family="system-ui,sans-serif" font-size="18" fill="#475569">正常、邊界、特殊</text></svg>
