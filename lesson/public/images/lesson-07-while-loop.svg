<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">while 迴圈：檢查、執行、更新、再檢查</title><desc id="desc">條件仍然成立就繼續；條件不成立或 break 時停止。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="40" font-weight="700" fill="#123f43">while 迴圈：檢查、執行、更新、再檢查</text><text x="600" y="113" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="23" fill="#57716a">條件仍然成立就繼續；條件不成立或 break 時停止。</text>
<g filter="url(#shadow)"><rect x="40" y="205" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="40" y="205" width="250" height="58" rx="20" fill="#187b71"/><text x="165.0" y="243" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#fff">設定次數</text><text x="165.0" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#187b71">count = 1</text><text x="165.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#47635d">從第一次開始</text></g>
<path d="M304 327H316" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="310.0" y="294" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="16" font-weight="700" fill="#0f766e">下一步</text>
<g filter="url(#shadow)"><rect x="330" y="205" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="330" y="205" width="250" height="58" rx="20" fill="#d78b1c"/><text x="455.0" y="243" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#fff">檢查條件</text><text x="455.0" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#d78b1c">count &lt;= 3</text><text x="455.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#47635d">是否仍要繼續？</text></g>
<path d="M594 327H606" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600.0" y="294" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="16" font-weight="700" fill="#0f766e">下一步</text>
<g filter="url(#shadow)"><rect x="620" y="205" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="620" y="205" width="250" height="58" rx="20" fill="#187b71"/><text x="745.0" y="243" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#fff">執行工作</text><text x="745.0" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#187b71">print(count)</text><text x="745.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#47635d">顯示這一輪內容</text></g>
<path d="M884 327H896" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="890.0" y="294" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="16" font-weight="700" fill="#0f766e">下一步</text>
<g filter="url(#shadow)"><rect x="910" y="205" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="910" y="205" width="250" height="58" rx="20" fill="#d78b1c"/><text x="1035.0" y="243" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#fff">更新資料</text><text x="1035.0" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#d78b1c">count + 1</text><text x="1035.0" y="390" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="19" fill="#47635d">準備下一次檢查</text></g>
<rect x="188" y="506" width="824" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="546" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="24" fill="#365c58">設定次數 → 檢查條件 → 執行工作 → 更新資料</text></svg>