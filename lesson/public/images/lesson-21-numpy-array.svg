<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NumPy：整組數字一起計算</title>
  <desc id="desc">三步顯示一組分數經過加五分運算，得到一組新分數。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf9f5"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#104a4d" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="88" cy="76" r="138" fill="#b5eedf" opacity=".42"/><circle cx="1135" cy="562" r="156" fill="#c8defe" opacity=".5"/>
  <text x="600" y="68" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#123f43">NumPy：整組數字一起計算</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#365c58">同一個運算，會套用到 array 裡的每一個數字。</text>

  <g filter="url(#shadow)">
    <rect x="58" y="165" width="302" height="285" rx="24" fill="#fffdf8" stroke="#65748b" stroke-width="3"/>
    <rect x="58" y="165" width="302" height="56" rx="22" fill="#65748b"/>
    <rect x="448" y="165" width="302" height="285" rx="24" fill="#fffdf8" stroke="#d2871c" stroke-width="3"/>
    <rect x="448" y="165" width="302" height="56" rx="22" fill="#d2871c"/>
    <rect x="838" y="165" width="302" height="285" rx="24" fill="#fffdf8" stroke="#14776d" stroke-width="3"/>
    <rect x="838" y="165" width="302" height="56" rx="22" fill="#14776d"/>
  </g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700" fill="#fff" font-size="20"><text x="82" y="201">1</text><text x="472" y="201">2</text><text x="862" y="201">3</text></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" font-weight="700" fill="#fff"><text x="212" y="201" text-anchor="middle">原本的 array</text><text x="602" y="201" text-anchor="middle">同一個運算</text><text x="992" y="201" text-anchor="middle">新的 array</text></g>

  <g font-family="Consolas,'Courier New',monospace" font-weight="700" font-size="28" text-anchor="middle"><text x="209" y="285" fill="#56677f">[78, 65, 91]</text><text x="599" y="287" fill="#bd7011">+ 5</text><text x="989" y="285" fill="#126c64">[83, 70, 96]</text></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" text-anchor="middle" fill="#365c58"><text x="209" y="343">三位同學的分數</text><text x="599" y="343">每一個數字都加 5</text><text x="989" y="343">更新後的整組結果</text></g>
  <g fill="#dbeafe" stroke="#6ea1df" stroke-width="2"><rect x="125" y="375" width="54" height="38" rx="10"/><rect x="182" y="375" width="54" height="38" rx="10"/><rect x="239" y="375" width="54" height="38" rx="10"/></g>
  <g fill="#dcfce7" stroke="#57ad7a" stroke-width="2"><rect x="905" y="375" width="54" height="38" rx="10"/><rect x="962" y="375" width="54" height="38" rx="10"/><rect x="1019" y="375" width="54" height="38" rx="10"/></g>
  <g font-family="Consolas,'Courier New',monospace" font-size="17" font-weight="700" text-anchor="middle"><text x="152" y="401" fill="#315782">78</text><text x="209" y="401" fill="#315782">65</text><text x="266" y="401" fill="#315782">91</text><text x="932" y="401" fill="#28633c">83</text><text x="989" y="401" fill="#28633c">70</text><text x="1046" y="401" fill="#28633c">96</text></g>
  <rect x="134" y="518" width="932" height="58" rx="18" fill="#fff" opacity=".87"/>
  <text x="600" y="555" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#365c58">NumPy array 特別適合對一整組數字做重複計算。</text>
</svg>
