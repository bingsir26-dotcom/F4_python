<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">IOAI 小型實驗：訓練、驗證與最後測試</title>
  <desc id="desc">同一份鳶尾花資料以同一 random state 分成訓練、驗證和測試。先以 validation 比較 k 等於 1 和 5，選定設定後才以 test 作最後總結。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f4c5c" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#bae6fd" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#bbf7d0" opacity=".5"/>
  <text x="600" y="68" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#123f43">IOAI 小型實驗：公平比較，最後才測試</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#365c58">固定資料分割和 random state，才知道比較的是模型設定，而不是剛好抽到的資料。</text>
  <g filter="url(#shadow)">
    <rect x="55" y="165" width="330" height="275" rx="24" fill="#fff" stroke="#2563eb" stroke-width="4"/><circle cx="100" cy="210" r="24" fill="#2563eb"/><text x="100" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="220" y="218" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">資料分成三份</text><text x="90" y="283" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#1d4ed8">train：約 50%</text><text x="90" y="321" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#0f766e">validation：約 25%</text><text x="90" y="359" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#b45309">test：約 25%</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="165" width="330" height="275" rx="24" fill="#fff" stroke="#0f9f8c" stroke-width="4"/><circle cx="480" cy="210" r="24" fill="#0f9f8c"/><text x="480" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="600" y="218" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">用 validation 比較</text><text x="600" y="288" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="22" fill="#0f766e">KNN: k = 1</text><text x="600" y="324" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="22" fill="#0f766e">KNN: k = 5</text><text x="600" y="385" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">只改一項設定，記錄 validation accuracy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="815" y="165" width="330" height="275" rx="24" fill="#fff" stroke="#d78b1c" stroke-width="4"/><circle cx="860" cy="210" r="24" fill="#d78b1c"/><text x="860" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="980" y="218" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#123f43">最後一次 test</text><text x="980" y="288" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#b45309">選好 k 後才測試</text><text x="980" y="328" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#b45309">報告 accuracy 和限制</text><text x="980" y="385" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="19" fill="#365c58">不是再用 test 選另一個 k</text>
  </g>
  <g filter="url(#shadow)"><rect x="170" y="490" width="860" height="72" rx="20" fill="#123f43"/><text x="600" y="535" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" font-weight="700" fill="#fff">完整報告還要記錄：資料集、random state、設定、錯誤例子、限制和下一步。</text></g>
</svg>
