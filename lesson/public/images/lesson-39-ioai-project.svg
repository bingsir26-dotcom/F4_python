<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">公平比較兩個 KNN 實驗設定</title>
  <desc id="desc">同一份鳶尾花資料、同一個 random state 和測試集，比較 k 一和 k 五的 KNN，並記錄結果和限制。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="44" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">IOAI 專題：比較要公平，記錄要可重現</text>
  <text x="44" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">資料分割和評估方法固定，只改一個主要設定，結果才有較清楚的比較意義。</text>
  <rect x="42" y="130" width="270" height="300" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">固定的比較條件</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#334155"><text x="75" y="221">資料：Iris</text><text x="75" y="260">test size：0.25</text><text x="75" y="299">random state：12</text><text x="75" y="338">評估：accuracy</text></g>
  <text x="75" y="395" font-family="system-ui,sans-serif" font-size="15" fill="#1d4ed8">兩次實驗保持相同</text>
  <rect x="350" y="130" width="282" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#334155">只改一個設定</text>
  <rect x="381" y="211" width="220" height="62" rx="12" fill="#dcfce7"/><text x="407" y="249" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#166534">實驗 1　KNN k = 1</text>
  <rect x="381" y="303" width="220" height="62" rx="12" fill="#fef3c7"/><text x="407" y="341" font-family="system-ui,sans-serif" font-size="19" font-weight="700" fill="#92400e">實驗 2　KNN k = 5</text>
  <text x="381" y="402" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">不是同時換模型、資料和 k。</text>
  <rect x="670" y="130" width="248" height="300" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="700" y="170" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#9a3412">報告不只最高分</text>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#7c2d12"><text x="700" y="221">1　全部設定和結果</text><text x="700" y="260">2　錯誤例子</text><text x="700" y="299">3　資料限制</text><text x="700" y="338">4　下一步</text></g>
  <text x="700" y="399" font-family="system-ui,sans-serif" font-size="15" fill="#c2410c">一次結果不等於永遠最好。</text>
</svg>
