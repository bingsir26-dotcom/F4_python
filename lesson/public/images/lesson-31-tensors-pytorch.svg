<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Tensor 是有形狀的數字資料</title>
  <desc id="desc">一個 Python 巢狀 List 變成二乘三的像素 Tensor，並顯示它的形狀和平均亮度。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="46" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">Tensor：數字不只要有值，也要有形狀</text>
  <text x="46" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">同樣是六個數字，[6] 和 [2, 3] 的排列方式並不相同。</text>
  <rect x="42" y="130" width="270" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="75" cy="170" r="17" fill="#2563eb"/><text x="69" y="177" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="103" y="177" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">Python List</text>
  <text x="70" y="220" font-family="monospace" font-size="17" fill="#334155">[[0, 80, 255],</text>
  <text x="70" y="250" font-family="monospace" font-size="17" fill="#334155"> [120, 180, 240]]</text>
  <text x="70" y="304" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">兩個小 List</text>
  <text x="70" y="331" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">每個有三個數字</text>
  <rect x="350" y="130" width="270" height="300" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="383" cy="170" r="17" fill="#0f766e"/><text x="377" y="177" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="411" y="177" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#134e4a">2 × 3 Tensor</text>
  <g stroke="#64748b" stroke-width="2"><rect x="407" y="218" width="150" height="100" fill="#dbeafe"/><path d="M457 218v100M507 218v100M407 268h150"/></g>
  <g font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#1e3a8a"><text x="432" y="249">0</text><text x="482" y="249">80</text><text x="532" y="249">255</text><text x="432" y="299">120</text><text x="482" y="299">180</text><text x="532" y="299">240</text></g>
  <text x="398" y="360" font-family="system-ui,sans-serif" font-size="16" fill="#475569">shape = [2, 3]</text>
  <text x="398" y="389" font-family="system-ui,sans-serif" font-size="16" fill="#475569">2 列、每列 3 個數字</text>
  <rect x="658" y="130" width="260" height="300" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <circle cx="691" cy="170" r="17" fill="#ea580c"/><text x="685" y="177" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="719" y="177" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#9a3412">可作數值運算</text>
  <text x="691" y="229" font-family="system-ui,sans-serif" font-size="17" fill="#334155">平均亮度</text>
  <text x="691" y="268" font-family="monospace" font-size="22" font-weight="700" fill="#c2410c">145.833...</text>
  <text x="691" y="328" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">Tensor 保存數字和位置；</text>
  <text x="691" y="354" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">欄位意義要靠名稱和註解。</text>
</svg>
