<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">列表有次序，第一個位置是 0</title><desc id="desc">列表中的每項資料都有一個索引位置，索引用來讀取或修改資料。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">列表有次序，第一個位置是 0</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">用方括號和索引位置，讀取或修改清單中的資料。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="58" rx="20" fill="#187b71"/><text x="180.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">位置 0</text><text x="180.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">&quot;藥水&quot;</text><text x="180.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">第一個元素</text></g>
<g filter="url(#shadow)"><rect x="335" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="335" y="175" width="250" height="58" rx="20" fill="#8b5cf6"/><text x="460.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">位置 1</text><text x="460.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#8b5cf6">&quot;地圖&quot;</text><text x="460.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">第二個元素</text></g>
<g filter="url(#shadow)"><rect x="615" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="615" y="175" width="250" height="58" rx="20" fill="#d78b1c"/><text x="740.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">位置 2</text><text x="740.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#d78b1c">&quot;鑰匙&quot;</text><text x="740.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">第三個元素</text></g>
<g filter="url(#shadow)"><rect x="895" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="895" y="175" width="250" height="58" rx="20" fill="#187b71"/><text x="1020.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">元素數量</text><text x="1020.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">len() = 3</text><text x="1020.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">共有三件物品</text></g>
<rect x="170" y="500" width="860" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="540" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="24" fill="#365c58">索引位置從 0 開始；len() 則用來數一數列表中有多少項資料。</text></svg>
