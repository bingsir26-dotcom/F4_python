<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">訓練、驗證和測試資料有不同工作</title>
  <desc id="desc">資料分成訓練、驗證和測試三份，右側折線圖顯示驗證 loss 在第三輪最低。</desc>
  <rect width="960" height="500" fill="#f8fbff"/>
  <text x="46" y="58" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#172554">驗證模型：不要只看訓練 loss</text>
  <text x="46" y="94" font-family="system-ui,sans-serif" font-size="18" fill="#475569">模型看過哪些資料、最後用哪些資料檢查，會影響我們如何解讀分數。</text>
  <rect x="42" y="130" width="340" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="172" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#334155">同一份資料分三份</text>
  <rect x="72" y="205" width="270" height="52" rx="12" fill="#dbeafe"/><text x="94" y="237" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">訓練集</text><text x="224" y="237" font-family="system-ui,sans-serif" font-size="15" fill="#334155">更新權重</text>
  <rect x="72" y="275" width="270" height="52" rx="12" fill="#dcfce7"/><text x="94" y="307" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#166534">驗證集</text><text x="224" y="307" font-family="system-ui,sans-serif" font-size="15" fill="#334155">選輪數和設定</text>
  <rect x="72" y="345" width="270" height="52" rx="12" fill="#fef3c7"/><text x="94" y="377" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#92400e">測試集</text><text x="224" y="377" font-family="system-ui,sans-serif" font-size="15" fill="#334155">最後才檢查</text>
  <rect x="424" y="130" width="494" height="300" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="456" y="172" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#334155">驗證 loss 的變化</text>
  <g stroke="#e2e8f0" stroke-width="1"><path d="M500 210H858M500 260H858M500 310H858M500 360H858"/><path d="M548 195V390M630 195V390M712 195V390M794 195V390M858 195V390"/></g>
  <path d="M500 195V390H858" fill="none" stroke="#64748b" stroke-width="2"/>
  <polyline points="530,225 610,288 690,330 770,315 840,270" fill="none" stroke="#16a34a" stroke-width="5"/>
  <polyline points="530,240 610,285 690,325 770,350 840,370" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="690" cy="330" r="9" fill="#dc2626" stroke="#fff" stroke-width="3"/>
  <text x="711" y="332" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#991b1b">第 3 輪最低</text>
  <text x="520" y="414" font-family="system-ui,sans-serif" font-size="14" fill="#16a34a">驗證 loss</text>
  <text x="650" y="414" font-family="system-ui,sans-serif" font-size="14" fill="#2563eb">訓練 loss</text>
  <text x="456" y="208" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">loss</text>
</svg>
