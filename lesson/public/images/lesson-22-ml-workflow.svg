<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">由例子學規律</title>
  <desc id="desc">以氣溫和雪糕銷量為例，分四步顯示機器學習由已知資料到預測新資料的過程。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#edf6ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#72501a" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="100" cy="92" r="152" fill="#ffe3a3" opacity=".38"/><circle cx="1128" cy="554" r="172" fill="#cbe4ff" opacity=".56"/>
  <text x="600" y="67" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="39" font-weight="700" fill="#453317">由例子學規律</text>
  <text x="600" y="110" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="22" fill="#6c604e">以「氣溫和雪糕銷量」為例：先看已知資料，再估計新資料。</text>
  <g filter="url(#shadow)"><rect x="43" y="170" width="258" height="320" rx="24" fill="#fffdf8" stroke="#df9b3a" stroke-width="3"/><rect x="331" y="170" width="258" height="320" rx="24" fill="#fffdf8" stroke="#5595d7" stroke-width="3"/><rect x="619" y="170" width="258" height="320" rx="24" fill="#fffdf8" stroke="#5c9d77" stroke-width="3"/><rect x="907" y="170" width="258" height="320" rx="24" fill="#fffdf8" stroke="#9962b2" stroke-width="3"/></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-weight="700"><circle cx="75" cy="203" r="19" fill="#df9b3a"/><circle cx="363" cy="203" r="19" fill="#5595d7"/><circle cx="651" cy="203" r="19" fill="#5c9d77"/><circle cx="939" cy="203" r="19" fill="#9962b2"/><g fill="#fff" font-size="18" text-anchor="middle"><text x="75" y="209">1</text><text x="363" y="209">2</text><text x="651" y="209">3</text><text x="939" y="209">4</text></g><g font-size="24" fill="#26394a"><text x="172" y="211" text-anchor="middle">已有例子</text><text x="460" y="211" text-anchor="middle">模型學習</text><text x="748" y="211" text-anchor="middle">新輸入</text><text x="1036" y="211" text-anchor="middle">模型估計</text></g></g>
  <g font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#58616d"><text x="72" y="255">氣溫</text><text x="209" y="255">售出杯數</text></g>
  <g font-family="Consolas,'Courier New',monospace" font-size="18" fill="#374151"><text x="78" y="294">20°C</text><text x="220" y="294">40</text><text x="78" y="332">24°C</text><text x="220" y="332">48</text><text x="78" y="370">28°C</text><text x="220" y="370">56</text><text x="78" y="408">32°C</text><text x="220" y="408">64</text></g><path d="M66 266H276M66 304H276M66 342H276M66 380H276M66 418H276" stroke="#eadcc5" stroke-width="2"/>
  <text x="460" y="290" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" fill="#27649b">model.fit(...)</text><text x="460" y="336" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#4a657b">從輸入和答案</text><text x="460" y="368" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#4a657b">找出可用規律</text><rect x="386" y="402" width="148" height="42" rx="14" fill="#e7f1ff"/><text x="460" y="430" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="17" fill="#27649b">不是保證答案</text>
  <text x="748" y="285" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="31" font-weight="700" fill="#35734f">[[30]]</text><text x="748" y="332" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#4c7559">30°C 的一筆新資料</text><rect x="669" y="380" width="158" height="46" rx="15" fill="#e8f7ea"/><text x="748" y="410" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="20" font-weight="700" fill="#35734f">predict(...)</text>
  <text x="1036" y="285" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="35" font-weight="700" fill="#7e438f">[60.]</text><text x="1036" y="332" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="20" fill="#704a79">約售出 60 杯</text><text x="1036" y="367" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="18" fill="#704a79">只根據已看過的資料估計</text>
  <rect x="128" y="537" width="944" height="53" rx="18" fill="#fff" opacity=".88"/><text x="600" y="572" text-anchor="middle" font-family="'Microsoft JhengHei','Noto Sans TC',sans-serif" font-size="21" fill="#625949">輸入資料又叫特徵；已知答案又叫標籤。</text>
</svg>
