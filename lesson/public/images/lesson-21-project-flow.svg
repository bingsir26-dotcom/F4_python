<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">資料分析作品的四個部分</title><desc id="desc">四個並列方框標示問題、資料、分析與圖表、結論與限制。</desc><rect width="960" height="390" fill="#f8fbff"/><g font-family="system-ui,sans-serif"><rect x="45" y="105" width="195" height="180" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="75" y="160" font-size="31" font-weight="700" fill="#1e3a8a">1 問題</text><text x="75" y="210" font-size="20" fill="#334155">想回答甚麼？</text><rect x="275" y="105" width="195" height="180" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="305" y="160" font-size="31" font-weight="700" fill="#166534">2 資料</text><text x="305" y="210" font-size="20" fill="#334155">有哪些欄位？</text><rect x="505" y="105" width="195" height="180" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="535" y="160" font-size="28" font-weight="700" fill="#92400e">3 分析</text><text x="535" y="210" font-size="20" fill="#334155">統計和圖表</text><rect x="735" y="105" width="180" height="180" rx="20" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/><text x="757" y="160" font-size="28" font-weight="700" fill="#9d174d">4 結論</text><text x="757" y="210" font-size="20" fill="#334155">證據和限制</text></g><text x="45" y="65" font-family="system-ui,sans-serif" font-size="25" fill="#475569">每一部分都要在作品中看得見</text></svg>