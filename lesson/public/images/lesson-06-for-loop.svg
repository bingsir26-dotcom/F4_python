<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">for 迴圈：逐一處理列表中的每一項</title><desc id="desc">每輪取出一份資料，執行一次縮排內的程式，最後得到結果。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">for 迴圈：逐一處理列表中的每一項</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">每輪取出一份資料，執行一次縮排內的程式。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="85" cy="205" r="19" fill="#187b71"/><text x="85" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">1</text><text x="180.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">分數列表</text><text x="180.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" fill="#187b71">[80, 90, 70]</text><text x="180.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">準備多筆資料</text></g>
<g filter="url(#shadow)"><rect x="345" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="345" y="175" width="250" height="58" rx="20" fill="#8b5cf6"/><circle cx="375" cy="205" r="19" fill="#8b5cf6"/><text x="375" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">2</text><text x="470.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">第一輪</text><text x="470.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#8b5cf6">score = 80</text><text x="470.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">執行一次工作</text></g>
<g filter="url(#shadow)"><rect x="635" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="635" y="175" width="250" height="58" rx="20" fill="#d78b1c"/><circle cx="665" cy="205" r="19" fill="#d78b1c"/><text x="665" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">3</text><text x="760.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">下一輪</text><text x="760.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#d78b1c">score = 90</text><text x="760.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">繼續處理資料</text></g>
<g filter="url(#shadow)"><rect x="925" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="925" y="175" width="250" height="58" rx="20" fill="#187b71"/><circle cx="955" cy="205" r="19" fill="#187b71"/><text x="955" y="212" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#fff">4</text><text x="1050.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">完成</text><text x="1050.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">total = 240</text><text x="1050.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">得到累積結果</text></g>
<rect x="190" y="500" width="820" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="540" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="24" fill="#365c58">第 2、3 步會為列表中的每一項資料重複進行，直到資料讀完。</text></svg>
