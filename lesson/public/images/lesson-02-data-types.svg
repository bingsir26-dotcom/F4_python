<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Python 先分清楚資料，再決定怎樣處理</title><desc id="desc">四種常見資料類型並列比較：整數、小數、文字、布林值。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">Python 先分清楚資料，再決定怎樣處理</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" fill="#365c58">同樣看似資料，類型不同，能做的事情也不同。</text>
<g filter="url(#shadow)"><rect x="55" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="175" width="250" height="58" rx="20" fill="#187b71"/><text x="180.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">整數</text><text x="180.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">100</text><text x="180.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">分數、生命值</text></g>
<g filter="url(#shadow)"><rect x="335" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="335" y="175" width="250" height="58" rx="20" fill="#187b71"/><text x="460.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">小數</text><text x="460.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#187b71">19.9</text><text x="460.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">價錢、平均分</text></g>
<g filter="url(#shadow)"><rect x="615" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="615" y="175" width="250" height="58" rx="20" fill="#8b5cf6"/><text x="740.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">文字</text><text x="740.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#8b5cf6">&quot;Alex&quot;</text><text x="740.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">名稱、訊息</text></g>
<g filter="url(#shadow)"><rect x="895" y="175" width="250" height="245" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="895" y="175" width="250" height="58" rx="20" fill="#d78b1c"/><text x="1020.0" y="213" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#fff">布林值</text><text x="1020.0" y="306" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="27" font-weight="700" fill="#d78b1c">True</text><text x="1020.0" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="19" fill="#47635d">是／否問題</text></g>
<rect x="210" y="500" width="780" height="62" rx="18" fill="#fff" opacity=".84"/><text x="600" y="540" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="24" fill="#365c58">先辨認資料種類，才能選擇合適的運算或判斷方式。</text></svg>
