<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">純文字檔案——把資料保存下來概念圖</title><desc id="desc">本課四個核心概念：建立、讀取、逐行、編碼。</desc><rect width="960" height="350" fill="#f8fbff"/><text x="40" y="64" font-family="system-ui,sans-serif" font-size="29" font-weight="700" fill="#1e293b">純文字檔案——把資料保存下來</text><text x="40" y="103" font-family="system-ui,sans-serif" font-size="19" fill="#64748b">用四個關鍵詞掌握本課重點</text><rect x="40" y="130" width="190" height="145" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="60" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">1 建立</text><text x="60" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">寫入文字</text><rect x="265" y="130" width="190" height="145" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="285" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#166534">2 讀取</text><text x="285" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">取回內容</text><rect x="490" y="130" width="190" height="145" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="510" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#92400e">3 逐行</text><text x="510" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">拆成 List</text><rect x="715" y="130" width="190" height="145" rx="20" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/><text x="735" y="188" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#9d174d">4 編碼</text><text x="735" y="235" font-family="system-ui,sans-serif" font-size="17" fill="#475569">使用 UTF-8</text></svg>
