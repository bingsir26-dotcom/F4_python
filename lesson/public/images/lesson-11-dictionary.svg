<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">角色 Dictionary 的資料格</title><desc id="desc">角色 player 的三項具名稱資料：name Alex，hp 100，gold 30。</desc><rect width="960" height="390" fill="#f8fbff"/><text x="60" y="76" font-family="ui-monospace,monospace" font-size="33" fill="#1e293b">player = { ... }</text><text x="60" y="116" font-family="system-ui,sans-serif" font-size="22" fill="#475569">同一位角色的資料，按名稱放在一起</text><g font-family="system-ui,sans-serif"><rect x="60" y="160" width="250" height="165" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="90" y="213" font-size="25" fill="#075985">key（資料名稱）</text><text x="90" y="270" font-family="ui-monospace,monospace" font-size="32" fill="#0c4a6e">"name"</text><rect x="355" y="160" width="250" height="165" rx="20" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/><text x="385" y="213" font-size="25" fill="#92400e">key（資料名稱）</text><text x="385" y="270" font-family="ui-monospace,monospace" font-size="32" fill="#78350f">"hp"</text><rect x="650" y="160" width="250" height="165" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="680" y="213" font-size="25" fill="#166534">key（資料名稱）</text><text x="680" y="270" font-family="ui-monospace,monospace" font-size="32" fill="#14532d">"gold"</text></g><g font-family="ui-monospace,monospace" font-size="30"><text x="120" y="365" fill="#0c4a6e">"Alex"</text><text x="450" y="365" fill="#78350f">100</text><text x="755" y="365" fill="#14532d">30</text></g></svg>