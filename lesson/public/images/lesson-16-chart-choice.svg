<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">選擇合適的圖表</title><desc id="desc">長條圖、折線圖、散點圖的用途比較。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eefcf8"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0c5c62" flood-opacity=".14"/></filter></defs>
<rect width="1200" height="620" rx="34" fill="url(#bg)"/><circle cx="92" cy="72" r="140" fill="#b5f1e2" opacity=".44"/><circle cx="1134" cy="572" r="162" fill="#c9e0ff" opacity=".52"/>
<text x="600" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="40" font-weight="700" fill="#123f43">選擇合適的圖表</text>
<text x="600" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="23" font-weight="400" fill="#365c58">不同圖表回答不同問題；沒有一種圖表適合所有資料。</text><g filter="url(#shadow)"><rect x="55" y="170" width="250" height="270" rx="22" fill="#fffdf8" stroke="#187b71" stroke-width="4"/><rect x="55" y="170" width="250" height="52" rx="20" fill="#187b71"/><text x="180.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">比較類別</text></g><text x="180" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#187b71">bar()</text><text x="180" y="325" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="400" fill="#365c58">長條圖</text><text x="180" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">先提出問題</text><g filter="url(#shadow)"><rect x="335" y="170" width="250" height="270" rx="22" fill="#fffdf8" stroke="#8b5cf6" stroke-width="4"/><rect x="335" y="170" width="250" height="52" rx="20" fill="#8b5cf6"/><text x="460.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">觀察變化</text></g><text x="460" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#8b5cf6">plot()</text><text x="460" y="325" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="400" fill="#365c58">折線圖</text><text x="460" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">先提出問題</text><g filter="url(#shadow)"><rect x="615" y="170" width="250" height="270" rx="22" fill="#fffdf8" stroke="#d78b1c" stroke-width="4"/><rect x="615" y="170" width="250" height="52" rx="20" fill="#d78b1c"/><text x="740.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">看數字關係</text></g><text x="740" y="265" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700" fill="#d78b1c">scatter()</text><text x="740" y="325" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="400" fill="#365c58">散點圖</text><text x="740" y="380" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">先提出問題</text><g filter="url(#shadow)"><rect x="895" y="170" width="250" height="270" rx="22" fill="#fffdf8" stroke="#0c5c62" stroke-width="4"/><rect x="895" y="170" width="250" height="52" rx="20" fill="#0c5c62"/><text x="1020.0" y="204" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="21" font-weight="700" fill="#fff">一張好圖</text></g><text x="1020" y="255" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">標題</text><text x="1020" y="305" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">座標軸</text><text x="1020" y="355" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#0c5c62">清楚問題</text><text x="1020" y="405" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="400" fill="#365c58">可解釋結果</text>
<rect x="150" y="525" width="900" height="54" rx="18" fill="#fff" opacity=".84"/><text x="600" y="560" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" fill="#365c58">圖表不是裝飾，而是幫助讀者看見資料中的關係。</text></svg>
